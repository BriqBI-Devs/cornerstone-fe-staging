<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Org chart | Cornerstone</title>
  <link rel="stylesheet" href="assets/people.css">
  <link rel="stylesheet" href="assets/orgchart.css">
  <link rel="stylesheet" href="assets/design2.css">
</head>
<body>
  <div id="shell"></div>
  <main>
    <div class="oc-head">
      <div>
        <p class="eyebrow"><a href="index.html">People</a></p>
        <h1>Org chart</h1>
      </div>
      <div class="oc-search">
        <label class="oc-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" placeholder="Search by name" aria-label="Search people" autocomplete="off"></label>
        <ul class="results" id="results" role="listbox" hidden></ul>
      </div>
    </div>
    <div id="chart"></div>
  </main>

  <script src="assets/data.js"></script>
  <script>
    document.getElementById("shell").innerHTML = SHELL(true);
    /* Adapter: the shared people data uses manager/team; the chart expects managerId/department/photo. */
    const ORG = PEOPLE.map((p) => ({ ...p, managerId: p.manager, department: p.team, photo: null, email: p.name.toLowerCase().replace(/[^a-z]+/g, ".") + "@example.com" }));
    const orgById = new Map(ORG.map((p) => [p.id, p]));
    const orgReports = (id) => ORG.filter((p) => p.managerId === id);
    const orgCount = (id) => orgReports(id).length;
    /* ===== State (memory only) ===== */
    const CELL = 229, GAP = 8;
    let path = [1];             // ancestor chain from the CEO down to the focused person
    let offsets = {};           // carousel page start per tier, keyed by manager id
    let shownTiers = [], lastX = {};        // manager ids of the tiers drawn last time (to animate only new ones)
    const chart = document.getElementById("chart");

    const chainTo = (id) => { const out = []; for (let p = orgById.get(id); p; p = orgById.get(p.managerId)) out.unshift(p.id); return out; };
    const perView = () => innerWidth <= 480 ? 1 : Math.min(5, Math.max(1, Math.floor((chart.clientWidth + GAP) / CELL)));

    /* ===== Render ===== */
    const card = (p, state) => {
      const n = orgCount(p.id), label = `${p.name}, ${p.title}, ${p.department}${n ? `, ${n} direct report${n > 1 ? "s" : ""}` : ""}`;
      const face = p.photo ? `<img class="avatar" src="${p.photo}" alt="">` : `<div class="avatar initials" aria-hidden="true">${initials(p.name)}</div>`;
      return `<div class="cell" role="listitem">
        <div class="card ${state}" data-dept="${FACETS.entity(byId(p.id))}">
          ${face}<div class="name" title="${p.name}">${p.name}</div>
          <div class="sub" title="${p.title}">${p.title}</div><div class="sub" title="${p.department}">${p.department}</div>
          ${state !== "idle" ? `<a class="view" href="profile.html?id=${p.id}">View profile</a>` : ""}
          <button class="hit" type="button" data-pick="${p.id}" aria-label="${label}" ${state === "focused" ? 'aria-current="true"' : ""}></button>
        </div>
        ${n ? `<span class="stub"></span><button class="badge" type="button" data-pick="${p.id}" tabindex="-1">${state === "idle" ? n : `${n} direct report${n > 1 ? "s" : ""}`}</button>` : ""}
      </div>`;
    };

    function render(focus) {
      const pv = perView(), W = chart.clientWidth, CARD = 221;
      // Tier 0 is the CEO alone; every later tier lists the reports of the person above it.
      const tiers = [[1], ...path.map((id) => orgReports(id).map((p) => p.id))].filter((ids) => ids.length);
      const keys = tiers.map((_, i) => (i === 0 ? 0 : path[i - 1]));
      // Every ancestor row up to the top is always loaded; the selected person gets the focus.
      const nextX = {};
      chart.innerHTML = tiers.map((ids, i) => {
        const at = ids.indexOf(path[i]), picked = at >= 0;
        const cards = ids.map((id) => card(orgById.get(id), id === path[i] ? (i === path.length - 1 ? "focused" : "open") : "idle")).join("");
        let width, x, nav;
        if (picked) {                       // a row with a selected person: that person is always in the middle
          width = W; x = W / 2 - (at * CELL + CARD / 2);
          const step = (dir, label, ok) => `<button class="nav step ${dir}" type="button" data-step="${dir === "prev" ? -1 : 1}" aria-label="${label}" ${ok ? "" : "hidden"}>${arrow(dir === "prev" ? "M15 6l-6 6 6 6" : "M9 6l6 6-6 6")}</button>`;
          nav = step("prev", "Previous person", at > 0) + step("next", "Next person", at < ids.length - 1);
        } else {                            // the last row (the reports) pages normally
          width = Math.min(ids.length, pv) * CELL - GAP;
          const off = offsets[keys[i]] = Math.max(0, Math.min(offsets[keys[i]] || 0, ids.length - pv));
          x = -off * CELL;
          nav = `<button class="nav prev" type="button" aria-label="Previous" ${off === 0 ? "hidden" : ""}>${arrow("M15 6l-6 6 6 6")}</button>
            <button class="nav next" type="button" aria-label="Next" ${off + pv >= ids.length ? "hidden" : ""}>${arrow("M9 6l6 6-6 6")}</button>`;
        }
        nextX[keys[i]] = x;
        // A row that already exists starts where it was, so the move to the new position slides.
        const start = shownTiers.includes(keys[i]) && lastX[keys[i]] !== undefined ? lastX[keys[i]] : x;
        return `<section class="tier ${shownTiers.includes(keys[i]) ? "" : "enter"}" data-depth="${i}" data-key="${keys[i]}" data-n="${ids.length}" data-picked="${picked}">
          <div class="stage" style="width:${width}px">${nav}
            <div class="viewport"><div class="track" role="list" data-x="${x}" style="transform:translateX(${start}px)">${cards}</div></div>
          </div>${i < tiers.length - 1 ? '<div class="sep"></div>' : ""}</section>`;
      }).join("");
      shownTiers = keys; lastX = nextX;
      chart.querySelectorAll(".track").forEach((t) => { void t.offsetWidth; t.style.transform = `translateX(${t.dataset.x}px)`; });
      if (focus) {                                   // keyboard focus, and bring a selected person's card to the middle of the screen
        const el = chart.querySelector(focus);
        if (el) { el.focus({ preventScroll: true }); if (focus.startsWith(".hit")) el.closest(".card")?.scrollIntoView({ block: "center" }); }
      }
    }
    const arrow = (d) => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

    /* ===== Events ===== */
    chart.addEventListener("click", (e) => {
      const pick = e.target.closest("[data-pick]"), nav = e.target.closest(".nav");
      const tier = (pick || nav)?.closest(".tier"), depth = tier ? +tier.dataset.depth : -1;
      if (nav?.dataset.step) {                      // beside the selected person: move to the previous or next person in that row
        const ids = orgReports(depth === 0 ? -1 : path[depth - 1]).map((p) => p.id), list = depth === 0 ? [1] : ids;
        const to = list[list.indexOf(path[depth]) + +nav.dataset.step];
        if (to) { path = path.slice(0, depth).concat(to); render(`.tier[data-depth="${depth}"] .step.${+nav.dataset.step < 0 ? "prev" : "next"}`); }
        return;
      }
      if (nav) return page(nav);
      if (!pick) return;
      path = path.slice(0, depth).concat(+pick.dataset.pick);   // drops every tier below, then shows this person's reports
      render(`.hit[data-pick="${pick.dataset.pick}"]`);
    });

    function page(button) {                         // slide the track in place so the CSS transition can play
      const tier = button.closest(".tier"), key = tier.dataset.key, n = +tier.dataset.n, pv = perView();
      const max = Math.max(0, n - pv), off = Math.max(0, Math.min(max, (offsets[key] || 0) + (button.classList.contains("next") ? pv : -pv)));
      offsets[key] = off;
      tier.querySelector(".track").style.transform = `translateX(${-off * CELL}px)`;
      tier.querySelector(".prev").hidden = off === 0;
      tier.querySelector(".next").hidden = off >= max;
    }


    /* Search: up to 6 matches; choosing one rebuilds the chart with the full ancestor chain. */
    const search = document.getElementById("search"), results = document.getElementById("results");
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      const found = q ? ORG.filter((p) => p.name.toLowerCase().includes(q)).slice(0, 6) : [];
      results.hidden = !found.length;
      results.innerHTML = found.map((p) => `<li><button type="button" data-id="${p.id}">${p.name}<small>${p.title}</small></button></li>`).join("");
    });
    results.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      path = chainTo(+b.dataset.id); search.value = ""; results.hidden = true; render(`.hit[data-pick="${b.dataset.id}"]`);
    });
    document.addEventListener("click", (e) => { if (!e.target.closest(".search")) results.hidden = true; });

    let timer; addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(() => render(), 120); });

    /* ===== Start: the CEO focused with their reports below; ?focus=<id> starts deeper ===== */
    const params = new URLSearchParams(location.search), start = +(params.get("id") || params.get("focus"));
    if (orgById.has(start)) path = chainTo(start);
    const jumpFocus = orgById.has(start) ? `.hit[data-pick="${start}"]` : undefined;   // a jump lands on the selected person
    render(jumpFocus);
    PHOTOS.then(() => { ORG.forEach((o) => { o.photo = byId(o.id).photo; }); render(jumpFocus); });

  </script>
</body>
</html>
