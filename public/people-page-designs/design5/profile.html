<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Cornerstone</title>
  <link rel="stylesheet" href="assets/people.css">
  <link rel="stylesheet" href="assets/feeds.css">
  <link rel="stylesheet" href="assets/d5.css">
  <link rel="stylesheet" href="assets/p5.css">
  <link rel="stylesheet" href="assets/edit-profile.css">
</head>
<body>
  <div id="shell"></div>
  <main class="p5-page">
    <a class="p5-back" href="index.html">← Back to People</a>
    <div id="profile"></div>
    <dialog id="editDlg" class="p5-dlg" aria-label="Edit profile"></dialog>
  </main>

  <script src="assets/data.js"></script>
  <script src="assets/edit-profile.js"></script>
  <script>
    document.getElementById("shell").innerHTML = SHELL(true);
    const ICON = { mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`, pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>`, chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>` };
    const COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
    const esc = PE_ESC;
    const SOC = {
      linkedin: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>',
      x: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-7.5 8.57L23 22h-6.9l-5.4-7.07L4.5 22H1.4l8-9.17L1 2h7.07l4.9 6.48L18.9 2zm-1.2 18h1.9L7.4 3.9H5.4L17.7 20z"/></svg>',
      facebook: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-.95.4-1.7 1.75-1.7H17V3.8c-.3 0-1.3-.15-2.4-.15-2.5 0-4.1 1.5-4.1 4.2v2.65H7.7v3.3h2.8V22h3z"/></svg>',
      instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>',
      youtube: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.76-1.77C18.3 5 12 5 12 5s-6.3 0-7.84.43A2.5 2.5 0 0 0 2.4 7.2C2 8.75 2 12 2 12s0 3.25.4 4.8a2.5 2.5 0 0 0 1.76 1.77C5.7 19 12 19 12 19s6.3 0 7.84-.43a2.5 2.5 0 0 0 1.76-1.77C22 15.25 22 12 22 12s0-3.25-.4-4.8zM10 15V9l5.2 3L10 15z"/></svg>',
    };
    const SOC_NAMES = [["linkedin", "LinkedIn"], ["x", "X"], ["facebook", "Facebook"], ["instagram", "Instagram"], ["youtube", "YouTube"]];
    const socialIcons = (e) => { const list = SOC_NAMES.filter(([k]) => /^https?:/i.test(e["social_" + k] || "")); return list.length ? `<div class="soc-row">${list.map(([k, l]) => `<a class="soc" href="${PE_ESC(e["social_" + k])}" target="_blank" rel="noopener" aria-label="${l}" title="${l}">${SOC[k]}</a>`).join("")}</div>` : ""; };
    const isSocial = (k) => SOC_NAMES.some(([, l]) => l === k || k === "X (Twitter)");
    const p = byId(new URLSearchParams(location.search).get("id"));
    if (!p) {
      document.title = "Person not found | Cornerstone";
      document.getElementById("profile").innerHTML = '<div class="p5-missing"><h1>Person not found</h1><p>This profile doesn\'t exist or may have been removed.</p><a class="btn primary" href="index.html">Back to People</a></div>';
    } else {
    loadProfileEdits(p);
    document.title = `${p.name} | Cornerstone`;
    const boss = byId(p.manager), reports = reportsOf(p.id), email = (p.edit && p.edit.email) || "";
    const chain = []; for (let x = boss; x; x = byId(x.manager)) chain.unshift(x);   // every manager up to the CEO
    const SHOW = 8;
    const line = (label, value, extra = "") => `<div class="p5-line"><dt>${label}</dt><dd>${value}${extra}</dd></div>`;
    const who = (q, note = "") => `<a class="p5-who" href="profile.html?id=${q.id}">${avatar(q)}<span><strong>${esc(q.name)}</strong><small>${esc(q.title)}</small></span>${note ? `<em>${note}</em>` : ""}</a>`;
    // Sample content (real data comes from SharePoint): published = authored by the person, mentioned = @tagged in
    const seed = [...String(p.id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
    const rnd = (n) => { let s = (seed + n * 2654435761) >>> 0; s = Math.imul(s ^ (s >>> 15), 2246822519); s ^= s >>> 13; return (s >>> 0) / 4294967296; };
    const IMG = "../assets/";
    const POOL = {
      p: [["12-Foot Snowman Arrives at HQ", "12-foot-snowman.jpg", "Company News"], ["Hispanic Heritage Month", "hispanic-heritage-month.jpg", "Community Updates"], ["Outdoor Event: Save the Date", "outdoor-event.jpg", "Company News"], ["River Crossing Family Day", "river-crossing-family-day.jpg", "Community Updates"], ["September Community Digest", "september-community-digest.jpg", "Community Updates"], ["Team Celebration Recap", "team-celebration.avif", "HR Central"], ["Workiversaries: Full List", "workiversaries-full-list.jpg", "HR Central"]],
      m: [[`Congratulations to ${p.name}`, "team-celebration.avif", "HR Central"], [`Workiversaries: ${p.name} + team`, "workiversaries-full-list.jpg", "HR Central"], [`September Community Digest: thanks ${p.name}`, "september-community-digest.jpg", "Community Updates"], [`River Crossing Family Day volunteers: ${p.name}`, "river-crossing-family-day.jpg", "Community Updates"], [`Hispanic Heritage Month panel with ${p.name}`, "hispanic-heritage-month.jpg", "Managers' Corner"], [`Outdoor Event hosts: ${p.name}`, "outdoor-event.jpg", "Company News"], [`Snowman build crew: ${p.name}`, "12-foot-snowman.jpg", "Company News"]],
    };
    // Two more of each kind, so every person has at least 7 published and 7 mentioned items (7 to 9).
    POOL.p.push(["August Community Digest", "august-community-digest.jpg", "Community Updates"], ["Diwali Across Our Offices", "diwali-across-offices.jpg", "Community Updates"]);
    POOL.m.push([`August new hires: welcome, and thanks ${p.name}`, "august-new-hires.jpg", "HR Central"], [`July Workiversaries: ${p.name}`, "july-workiversaries.jpg", "HR Central"]);
    const make = (kind, count) => POOL[kind].map(([title, img, site], i) => ({ title, img, site, ms: Date.UTC(2022, 0, 1) + Math.floor(rnd(i + 99 + (kind === "m" ? 50 : 0)) * (Date.UTC(2026, 4, 1) - Date.UTC(2022, 0, 1))), lock: site === "Managers' Corner" })).sort((x, y) => rnd(x.ms) - rnd(y.ms)).slice(0, Math.min(count, POOL[kind].length));
    const FEED = {
      published: { label: "Published", items: make("p", 7 + Math.floor(rnd(1) * 3)) },
      mentioned: { label: "Mentioned", items: make("m", 7 + Math.floor(rnd(2) * 3)) },
    };
    const PER = { published: 10, mentioned: 10 }, LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    const st = { feed: "published", published: { page: 1, sort: "latest" }, mentioned: { page: 1, sort: "latest" } };
    const fmt = (ms) => new Date(ms).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
    const feed = (key) => {
      const { label, items } = FEED[key], s = st[key];
      const sorted = [...items].sort((a, b) => s.sort === "latest" ? b.ms - a.ms : a.ms - b.ms);
      const PAGE = PER[key], pages = Math.max(1, Math.ceil(sorted.length / PAGE));
      s.page = Math.min(s.page, pages);
      const rows = sorted.slice((s.page - 1) * PAGE, s.page * PAGE).map((c) => `<li class="k4-item"><a class="k4-thumb" href="#" data-stub aria-label="${esc(c.title)}"><img src="${IMG}${c.img}" alt="" loading="lazy"></a><div><a class="k4-title" href="#" data-stub>${esc(c.title)}</a><p>In <a href="#" data-stub>${c.lock ? LOCK : ""}${esc(c.site)}</a> on ${fmt(c.ms)}</p></div></li>`).join("");
      const nums = Array.from({ length: pages }, (_, i) => i + 1).filter((n) => pages <= 7 || n === 1 || n === pages || Math.abs(n - s.page) <= 1)
        .flatMap((n, i, a) => (i && n - a[i - 1] > 1 ? ['<span aria-hidden="true">…</span>'] : []).concat(`<button type="button" data-feed="${key}" data-page="${n}" aria-label="Page ${n}" ${n === s.page ? 'aria-current="page"' : ""}>${n}</button>`)).join("");
      return `<section class="k4-feed" aria-labelledby="f-activity">
        <header><h2 id="f-activity">Activity</h2>
          <label>Sort by: <select data-feed="${key}" data-sort><option value="latest" ${s.sort === "latest" ? "selected" : ""}>Latest</option><option value="oldest" ${s.sort === "oldest" ? "selected" : ""}>Oldest</option></select></label></header>
        <div class="k4-tabs" role="tablist" aria-label="Activity">${["published", "mentioned"].map((k) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${st.feed === k}">${FEED[k].label}<em>${FEED[k].items.length}</em></button>`).join("")}</div>
        <ul>${rows}</ul>
        ${pages > 1 ? `<nav class="k4-pg" aria-label="${label} pages"><button type="button" data-feed="${key}" data-page="${s.page - 1}" ${s.page === 1 ? "disabled" : ""} aria-label="Previous page">‹</button>${nums}<button type="button" data-feed="${key}" data-page="${s.page + 1}" ${s.page === pages ? "disabled" : ""} aria-label="Next page">›</button></nav>` : ""}
      </section>`;
    };
    const DET = PROFILE_DETAILS(p);
    const EDIT = initProfileEdit({ p, boss, email });
    document.addEventListener("click", (e) => { if (e.target.closest("[data-edit]")) EDIT.open(); });
    const show = () => document.getElementById("profile").innerHTML = `
      ${PROFILE_BANNER(p)}
      <section class="p5-hero">
        <button type="button" class="btn p5-edit" data-edit>✎ Edit profile</button>
        <div class="p5-photo">${avatar(p)}</div>
        <div class="p5-intro">
          <h1>${esc(p.name)}${p.edit?.pronouns ? ` <span class="p5-pron">${PE_ESC(p.edit.pronouns)}</span>` : ""}</h1>
          <p class="p5-meta">${[p.title, p.edit.company || FACETS.company(p), p.edit.department || p.team].filter(Boolean).map(PE_ESC).join('<i aria-hidden="true">·</i>')}</p>
          <p class="p5-links">${email ? `<a class="btn primary" href="mailto:${esc(email)}">${ICON.mail} Send email</a>` : ""}<a class="btn" href="org-chart.html?id=${p.id}">${ICON.chart} View org chart</a></p>
        </div>
      </section>

      <section class="p5-sec">
        <h2><span>01</span>Details</h2>
        <div class="p5-two">
          <div>
            <h3 class="p5-sub">Contact</h3>
            ${DETAIL_LIST("contact", DET.contact.filter(([k]) => !isSocial(k)).map(([k, v]) => line(k, v)), "p5-lines one")}
            ${socialIcons(p.edit)}
          </div>
          <div>
            <h3 class="p5-sub">Additional</h3>
            ${DETAIL_LIST("additional", DET.additional.map(([k, v]) => line(k, v)), "p5-lines one")}
          </div>
        </div>
      </section>

      <section class="p5-sec">
        <h2><span>02</span>Org chart<a href="org-chart.html?id=${p.id}">Open full chart →</a></h2>
        <div class="p5-org">
          <div>
            <h3>Reporting chain</h3>
            <ol class="p5-chain">
              ${chain.map((q) => `<li>${who(q)}</li>`).join("")}
              <li class="me">${who(p, "Selected")}</li>
            </ol>
          </div>
          <div>
            <h3>Direct reports${reports.length ? ` · ${reports.length}` : ""}</h3>
            ${reports.length ? `<div class="p5-reps">${reports.slice(0, SHOW).map((q) => who(q)).join("")}</div>${reports.length > SHOW ? `<a class="p5-more" href="org-chart.html?id=${p.id}">+ ${reports.length - SHOW} more in org chart →</a>` : ""}` : `<p class="p5-none">No direct reports.</p>`}
          </div>
        </div>
      </section>

      <section class="p5-sec"><h2><span>03</span>Activity</h2><div class="p5-feeds">${feed(st.feed)}</div></section>`;

    const root = document.getElementById("profile");
    root.addEventListener("click", async (e) => {
      const tb = e.target.closest("[data-tab]");
      if (tb) { st.feed = tb.dataset.tab; show(); return; }
      if (e.target.closest("[data-stub]")) { e.preventDefault(); return; }   // content links go to SharePoint pages in the real app
      const pg = e.target.closest("button[data-page]");
      if (pg) { st[pg.dataset.feed].page = +pg.dataset.page; show(); return; }
      const b = e.target.closest("[data-copy]");
      if (!b) return;
      try { await navigator.clipboard.writeText(b.dataset.copy); } catch { /* clipboard unavailable: still confirm below */ }
      const m = document.getElementById("toast");
      m.textContent = "Copied to clipboard";
      setTimeout(() => { m.textContent = ""; }, 2000);
    });
    root.addEventListener("change", (e) => {
      const s = e.target.closest("select[data-sort]");
      if (s) { st[s.dataset.feed] = { page: 1, sort: s.value }; show(); }
    });
    show();
    PHOTOS.then(show);
      }
  </script>
</body>
</html>
