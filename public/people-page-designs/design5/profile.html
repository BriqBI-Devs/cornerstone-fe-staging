<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Cornerstone</title>
  <link rel="stylesheet" href="assets/people.css">
  <link rel="stylesheet" href="assets/feeds.css">
  <link rel="stylesheet" href="assets/d5.css">
  <link rel="stylesheet" href="assets/p5.css">
</head>
<body>
  <div id="shell"></div>
  <main class="p5-page">
    <a class="p5-back" href="index.html">← Back to People</a>
    <div id="profile"></div>
    <dialog id="editDlg" class="p5-dlg" aria-label="Edit profile"></dialog>
  </main>

  <script src="assets/data.js"></script>
  <script>
    document.getElementById("shell").innerHTML = SHELL(true);
    const ICON = { mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`, pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>`, chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>` };
    const COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
    const p = byId(new URLSearchParams(location.search).get("id")) || PEOPLE[0];
    try { const s = JSON.parse(localStorage.getItem(`p5-edit-${p.id}`) || "null"); if (s) { p.name = s.name; p.title = s.title; p.manager = s.manager; p.edit = s.edit; } } catch { /* storage unavailable */ }
    let flash = false; try { flash = sessionStorage.getItem("p5-saved") === "1"; sessionStorage.removeItem("p5-saved"); } catch { /* ignore */ }
    document.title = `${p.name} | Cornerstone`;
    const boss = byId(p.manager), reports = reportsOf(p.id), email = p.name.toLowerCase().replace(/[^a-z]+/g, ".") + "@example.com";
    const chain = []; for (let x = boss; x; x = byId(x.manager)) chain.unshift(x);   // every manager up to the CEO
    const SHOW = 8;
    // Tenant-specific "additional columns". Each tenant can change this list; the form and the profile are built from it.
    const CUSTOM_FIELDS = [
      ["management", "Management", () => FACETS.management(p)],
      ["entity", "Entity", () => FACETS.entity(p)],
      ["businessLine", "Department/Business Line", () => FACETS.department(p)],
      ["officeDays", "Office Days", () => DEF.officeDays],
    ];
    const LANGUAGES = [["en-US", "English (US) - English (US)"], ["en-GB", "English (UK) - English (UK)"], ["es", "Español - Spanish"], ["fr", "Français - French"], ["de", "Deutsch - German"], ["pt-BR", "Português (Brasil) - Portuguese (Brazil)"], ["hi", "हिन्दी - Hindi"]];
    const line = (label, value, extra = "") => `<div class="p5-line"><dt>${label}</dt><dd>${value}${extra}</dd></div>`;
    const who = (q, note = "") => `<a class="p5-who" href="profile.html?id=${q.id}">${avatar(q)}<span><strong>${q.name}</strong><small>${q.title}</small></span>${note ? `<em>${note}</em>` : ""}</a>`;
    // Sample content (real data comes from SharePoint): published = authored by the person, mentioned = @tagged in
    const seed = [...String(p.id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
    const rnd = (n) => { let s = (seed + n * 2654435761) >>> 0; s = Math.imul(s ^ (s >>> 15), 2246822519); s ^= s >>> 13; return (s >>> 0) / 4294967296; };
    const IMG = "../assets/";
    const POOL = {
      p: [["12-Foot Snowman Arrives at HQ", "12-foot-snowman.jpg", "Company News"], ["Hispanic Heritage Month", "hispanic-heritage-month.jpg", "Community Updates"], ["Outdoor Event: Save the Date", "outdoor-event.jpg", "Company News"], ["River Crossing Family Day", "river-crossing-family-day.jpg", "Community Updates"], ["September Community Digest", "september-community-digest.jpg", "Community Updates"], ["Team Celebration Recap", "team-celebration.avif", "HR Central"], ["Workiversaries: Full List", "workiversaries-full-list.jpg", "HR Central"]],
      m: [[`Congratulations to ${p.name}`, "team-celebration.avif", "HR Central"], [`Workiversaries: ${p.name} + team`, "workiversaries-full-list.jpg", "HR Central"], [`September Community Digest: thanks ${p.name}`, "september-community-digest.jpg", "Community Updates"], [`River Crossing Family Day volunteers: ${p.name}`, "river-crossing-family-day.jpg", "Community Updates"], [`Hispanic Heritage Month panel with ${p.name}`, "hispanic-heritage-month.jpg", "Managers' Corner"], [`Outdoor Event hosts: ${p.name}`, "outdoor-event.jpg", "Company News"], [`Snowman build crew: ${p.name}`, "12-foot-snowman.jpg", "Company News"]],
    };
    const make = (kind, count) => POOL[kind].map(([title, img, site], i) => ({ title, img, site, ms: Date.UTC(2022, 0, 1) + Math.floor(rnd(i + 99 + (kind === "m" ? 50 : 0)) * (Date.UTC(2026, 4, 1) - Date.UTC(2022, 0, 1))), lock: site === "Managers' Corner" })).sort((x, y) => rnd(x.ms) - rnd(y.ms)).slice(0, Math.min(count, 7));
    const FEED = {
      published: { label: "Published", items: make("p", 3 + Math.floor(rnd(1) * 5)) },
      mentioned: { label: "Mentioned", items: make("m", 2 + Math.floor(rnd(2) * 6)) },
    };
    const PER = { published: 4, mentioned: 4 }, LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    const st = { published: { page: 1, sort: "latest" }, mentioned: { page: 1, sort: "latest" } };
    const fmt = (ms) => new Date(ms).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
    const feed = (key) => {
      const { label, items } = FEED[key], s = st[key];
      const sorted = [...items].sort((a, b) => s.sort === "latest" ? b.ms - a.ms : a.ms - b.ms);
      const PAGE = PER[key], pages = Math.max(1, Math.ceil(sorted.length / PAGE));
      s.page = Math.min(s.page, pages);
      const rows = sorted.slice((s.page - 1) * PAGE, s.page * PAGE).map((c) => `<li class="k4-item"><a class="k4-thumb" href="#" aria-label="${c.title}"><img src="${IMG}${c.img}" alt="" loading="lazy"></a><div><a class="k4-title" href="#">${c.title}</a><p>In <a href="#">${c.lock ? LOCK : ""}${c.site}</a> on ${fmt(c.ms)}</p></div></li>`).join("");
      const nums = Array.from({ length: pages }, (_, i) => `<button type="button" data-feed="${key}" data-page="${i + 1}" ${i + 1 === s.page ? 'aria-current="page"' : ""}>${i + 1}</button>`).join("");
      return `<section class="k4-feed" aria-labelledby="f-${key}">
        <header><h2 id="f-${key}">${label} <em>${items.length}</em></h2>
          <label>Sort by: <select data-feed="${key}" data-sort><option value="latest" ${s.sort === "latest" ? "selected" : ""}>Latest</option><option value="oldest" ${s.sort === "oldest" ? "selected" : ""}>Oldest</option></select></label></header>
        <ul>${rows}</ul>
        ${pages > 1 ? `<nav class="k4-pg" aria-label="${label} pages"><button type="button" data-feed="${key}" data-page="${s.page - 1}" ${s.page === 1 ? "disabled" : ""} aria-label="Previous page">‹</button>${nums}<button type="button" data-feed="${key}" data-page="${s.page + 1}" ${s.page === pages ? "disabled" : ""} aria-label="Next page">›</button></nav>` : ""}
      </section>`;
    };
    const show = () => document.getElementById("profile").innerHTML = `
      ${flash ? `<p class="p5-flash" role="status">Profile updated.</p>` : ""}
      <section class="p5-hero">
        <button type="button" class="p5-edit" data-edit>✎ Edit profile</button>
        <div class="p5-photo">${avatar(p)}</div>
        <div class="p5-intro">
          <h1>${p.name}${p.edit?.pronouns ? ` <span class="p5-pron">${esc(p.edit.pronouns)}</span>` : ""}</h1>
          <p class="p5-meta">${[p.title, p.edit?.company || FACETS.company(p), p.edit?.department || FACETS.department(p)].filter(Boolean).map(esc).join('<i aria-hidden="true">·</i>')}</p>
          ${p.edit?.bio ? `<div class="p5-bio">${p.edit.bio}</div>` : `<p class="p5-sum">Based in ${p.location}${boss ? `, reporting to <a href="profile.html?id=${boss.id}">${boss.name}</a>` : " and leading the organization"}${reports.length ? `, with ${reports.length} direct report${reports.length > 1 ? "s" : ""}` : ""}.</p>`}
          <p class="p5-links"><a href="mailto:${email}">Send email ${ICON.mail}</a><a href="org-chart.html?id=${p.id}">View org chart ${ICON.chart}</a></p>
        </div>
      </section>

      <section class="p5-sec">
        <h2><span>01</span>Details</h2>
        <div class="p5-two">
          <div>
            <h3 class="p5-sub">Contact</h3>
            ${DETAIL_LIST("contact", [
                line("Email", `<a href="mailto:${email}">${email}</a>`, `<button type="button" class="p5-copy" data-copy="${email}" aria-label="Copy email address">${COPY}</button>`),
                got("phone") ? line("Phone", `<a href="tel:${esc(got("phone"))}">${esc(got("phone"))}</a>`) : "",
                got("mobile") ? line("Mobile phone", `<a href="tel:${esc(got("mobile"))}">${esc(got("mobile"))}</a>`) : "",
                line("Time zone", esc((ZONES.find(([v]) => v === p.edit?.timezone) || [])[1] || FACETS.timezone(p))),
                Object.keys(p.edit).length ? [got("ext") ? line("Extension", esc(got("ext"))) : "", got("zoom") ? line("Zoom meeting ID", esc(got("zoom"))) : "", ...SOCIAL.map(([k, l]) => p.edit["social_" + k] ? line(l, `<a href="${esc(p.edit["social_" + k])}" target="_blank" rel="noopener">${esc(p.edit["social_" + k].split("//").pop().replace("www.", ""))}</a>`) : "")].join("") : "",
              ].flat().filter(Boolean), "p5-lines one")}
          </div>
          <div>
            <h3 class="p5-sub">Additional</h3>
            ${DETAIL_LIST("additional", [
                got("employeeNumber") ? line("Employee number", esc(got("employeeNumber"))) : "",
                got("userType") ? line("User type", esc(got("userType"))) : "",
                line("Language", esc((LANGUAGES.find(([v]) => v === (p.edit.language || "en-US")) || [])[1])),
                (p.edit.cf_officeDays ?? DEF.officeDays) ? line("Office Days", esc(p.edit.cf_officeDays ?? DEF.officeDays)) : "",
                Object.keys(p.edit).length ? CUSTOM_FIELDS.filter(([key]) => key !== "officeDays").map(([key, l]) => p.edit["cf_" + key] ? line(l, esc(p.edit["cf_" + key])) : "").join("") : "",
              ].flat().filter(Boolean), "p5-lines one")}
          </div>
        </div>
        <p class="p5-toast" id="toast" role="status"></p>
      </section>

      <section class="p5-sec">
        <h2><span>02</span>Org chart<a href="org-chart.html?id=${p.id}">Open full chart →</a></h2>
        <div class="p5-org">
          <div>
            <h3>Reporting chain</h3>
            <ol class="p5-chain">
              ${chain.map((q) => `<li>${who(q)}</li>`).join("")}
              <li class="me">${who(p, "Selected")}</li>
            </ol>
          </div>
          <div>
            <h3>Direct reports${reports.length ? ` · ${reports.length}` : ""}</h3>
            ${reports.length ? `<div class="p5-reps">${reports.slice(0, SHOW).map((q) => who(q)).join("")}</div>${reports.length > SHOW ? `<a class="p5-more" href="org-chart.html?id=${p.id}">+ ${reports.length - SHOW} more in org chart →</a>` : ""}` : `<p class="p5-none">No direct reports.</p>`}
          </div>
        </div>
      </section>

      <section class="p5-sec"><h2><span>03</span>Content</h2><div class="p5-feeds">${feed("published")}${feed("mentioned")}</div></section>`;

    /* ===== Edit profile dialog (Personal, About, Contact, Org chart) ===== */
    const dlg = document.getElementById("editDlg");
    const EMOJI = ["😀", "😃", "😄", "😁", "😆", "😅", "😂", "🙂", "😉", "😊", "😍", "🥰", "😘", "😎", "🤩", "🤗", "🤔", "😐", "😴", "😢", "😭", "😡", "🥳", "🙌", "👏", "👍", "👋", "🙏", "💪", "🎉", "🎊", "✨", "🔥", "💡", "📌", "📎", "📅", "✅", "❌", "❤️", "💙", "💚", "💛", "🌟", "☀️", "🌈", "🚀", "🏆", "📣", "📞", "💬", "🍀", "☕", "🎯", "🏠", "🌍", "🎓", "💼", "🤝"];
    let savedRange = null, savedText = "";
    const saveSel = () => {
      const sel = getSelection(), area = dlg.querySelector("#bio");
      if (sel.rangeCount && area.contains(sel.anchorNode)) { savedRange = sel.getRangeAt(0).cloneRange(); savedText = sel.toString(); }
      else { savedRange = null; savedText = ""; }
    };
    const insertAtCursor = (content, html = false) => {
      const area = dlg.querySelector("#bio"); area.focus();
      const sel = getSelection(); sel.removeAllRanges();
      if (savedRange) sel.addRange(savedRange); else { const r = document.createRange(); r.selectNodeContents(area); r.collapse(false); sel.addRange(r); }
      document.execCommand(html ? "insertHTML" : "insertText", false, content);
    };
    const PRONOUNS = ["She/her", "He/him", "They/them", "She/they", "He/they", "Ze/zir", "Prefer not to say"];
    const ZONES = [["America/New_York", "(GMT-04:00) Eastern Time - New York"], ["America/Chicago", "(GMT-05:00) Central Time - Chicago"], ["America/Denver", "(GMT-06:00) Mountain Time - Denver"], ["America/Los_Angeles", "(GMT-07:00) Pacific Time - Los Angeles"], ["Europe/London", "(GMT+01:00) British Time - London"], ["Europe/Paris", "(GMT+02:00) Central European Time - Paris"], ["Asia/Kolkata", "(GMT+05:30) India Standard Time - Kolkata"], ["Asia/Tokyo", "(GMT+09:00) Japan Standard Time - Tokyo"], ["Australia/Sydney", "(GMT+10:00) Australian Eastern Time - Sydney"]];
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const SOCIAL = [["linkedin", "LinkedIn", "https://www.linkedin.com/in/username"], ["x", "X (Twitter)", "https://x.com/username"], ["facebook", "Facebook", "https://www.facebook.com/username"], ["instagram", "Instagram", "https://www.instagram.com/username"], ["youtube", "YouTube", "https://www.youtube.com/@channel"]];
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    p.edit = p.edit || {};
    const pad = String(p.id).padStart(2, "0");
    const DEF = {
      phone: `(212) 555-01${pad}`, mobile: `(917) 555-02${pad}`, employeeNumber: `E-${1000 + p.id}`, userType: "Employee",
      officeDays: ["Mon, Wed, Thu", "Tue, Wed, Thu", "Mon, Tue, Fri", "Wed, Thu"][p.id % 4],
    };
    const got = (k) => p.edit[k] ?? DEF[k] ?? "";   // a cleared field is "" and stays hidden on the profile
    const val = (k, fallback = "") => p.edit[k] ?? fallback;

    const text = (name, label, { max = 255, required = false, placeholder = "", type = "text", fallback = "" } = {}) =>
      `<label class="f"><span>${label}${required ? ' <b aria-hidden="true">*</b>' : ""}</span><input name="${name}" type="${type}" maxlength="${max}" ${required ? "required" : ""} placeholder="${esc(placeholder)}" value="${esc(val(name, fallback))}"></label>`;
    // Searchable dropdown: type to filter the list; the stored value is kept in a hidden field, and "×" clears it.
    const picker = (name, label, options, current, note = "") => {
      const sel = options.find(([v]) => String(v) === String(current));
      return `<div class="f"><span>${label}</span><div class="pk">
        <input type="text" list="dl-${name}" data-pk="${name}" placeholder="Search…" autocomplete="off" value="${esc(sel ? sel[1] : "")}">
        <input type="hidden" name="${name}" value="${esc(sel ? sel[0] : "")}">
        <button type="button" class="pk-clear" data-clear="${name}" aria-label="Clear ${label}">×</button>
        <datalist id="dl-${name}">${options.map(([v, l]) => `<option value="${esc(l)}"></option>`).join("")}</datalist></div>${note ? `<small>${note}</small>` : ""}</div>`;
    };
    const people = PEOPLE.filter((q) => q.id !== p.id).sort((a, b) => a.name.localeCompare(b.name)).map((q) => [q.id, `${q.name} — ${q.title}`]);
    const mgrFace = (q) => q ? `${avatar(q)}<span><strong>${esc(q.name)}</strong><small>${esc(q.title)}</small></span>` : `<span class="none"><strong>No manager</strong><small>Top of the organization</small></span>`;
    const first = p.name.split(" ")[0], last = p.name.split(" ").slice(1).join(" ");

    const formHtml = () => `
      <form id="editForm" novalidate>
        <div class="dlg-head"><h2>Edit profile</h2><button type="button" class="dlg-x" data-close aria-label="Close">×</button></div>
        <div class="dlg-tabs" role="tablist">${["Personal", "About", "Contact", "Additional", "Org chart"].map((t, i) => `<button type="button" role="tab" data-dtab="${i}" aria-selected="${i === 0}">${t}</button>`).join("")}</div>
        <div class="dlg-body">
          <fieldset data-pane="0"><legend>Personal</legend>
            <div class="grid2">
              ${text("first", "First name", { max: 80, required: true, fallback: first })}
              ${text("last", "Last name", { max: 80, required: true, fallback: last })}
            </div>
            ${text("jobTitle", "Job title", { fallback: p.title })}
            <div class="grid2">
              ${text("company", "Company name", { fallback: FACETS.company(p) })}
              ${text("entity", "Entity", { fallback: FACETS.entity(p) })}
              ${text("department", "Department", { fallback: FACETS.department(p) })}
              ${text("division", "Division")}
            </div>
            ${picker("pronouns", "Pronouns", PRONOUNS.map((x) => [x, x]), val("pronouns"))}
            ${text("address1", "Address 1")}
            ${text("address2", "Address 2")}
            <div class="grid3">
              ${text("city", "City")}
              ${text("state", "State/Province")}
              ${text("zip", "ZIP/Postal code")}
            </div>
            ${text("country", "Country")}
          </fieldset>

          <fieldset data-pane="1" hidden><legend>About</legend>
            <div class="f"><span>Bio</span>
              <div class="rte">
                <div class="rte-bar" role="toolbar" aria-label="Formatting">
                  <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
                  <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
                  <button type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
                  <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
                  <span class="sep"></span>
                  <button type="button" data-cmd="insertUnorderedList" title="Bullet list">•≡</button>
                  <button type="button" data-cmd="insertOrderedList" title="Numbered list">1.</button>
                  <span class="sep"></span>
                  <button type="button" data-cmd="emoji" title="Emoji">☺</button>
                  <button type="button" data-cmd="link" title="Insert link">🔗</button>
                </div>
                <div class="rte-pop" id="rtePop" hidden></div>
                <div class="rte-area" id="bio" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Share a bit about yourself...">${val("bio")}</div>
              </div>
            </div>
            <div class="grid2">
              <label class="f"><span>Birthday</span><input name="birthday" type="date" value="${esc(val("birthday", val("bMonth") && val("bDay") ? `2000-${String(val("bMonth")).padStart(2, "0")}-${String(val("bDay")).padStart(2, "0")}` : ""))}"></label>
              <label class="f"><span>Hire date</span><input name="hire" type="date" value="${esc(val("hire", p.joined || ""))}"></label>
            </div>
          </fieldset>

          <fieldset data-pane="2" hidden><legend>Contact</legend>
            ${text("email", "Email", { type: "email", fallback: email })}
            ${picker("timezone", "Time zone", ZONES, val("timezone", "America/New_York"))}
            <div class="grid3">
              ${text("phone", "Phone", { type: "tel", fallback: DEF.phone })}
              ${text("ext", "Extension")}
              ${text("mobile", "Mobile phone", { type: "tel", fallback: DEF.mobile })}
            </div>
            ${text("zoom", "Zoom Personal Meeting ID", { placeholder: "123 456 7890" })}
            <div class="f"><span>Social links</span><div class="social">${SOCIAL.map(([k, l, ph]) => `<label><i>${l}</i><input name="social_${k}" type="url" placeholder="${ph}" value="${esc(val("social_" + k))}"></label>`).join("")}</div></div>
          </fieldset>

          <fieldset data-pane="3" hidden><legend>Additional</legend>
            <div class="grid2">
              ${text("employeeNumber", "Employee number", { fallback: DEF.employeeNumber })}
              ${text("userType", "User type", { fallback: DEF.userType })}
            </div>
            <label class="f"><span>Language</span><select name="language">${LANGUAGES.map(([v, l]) => `<option value="${v}" ${val("language", "en-US") === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
            ${CUSTOM_FIELDS.map(([k, l, def]) => text("cf_" + k, l, { max: 1024, fallback: def() })).join("")}
          </fieldset>

          <fieldset data-pane="4" hidden><legend>Org chart</legend>
            <div class="f"><span>Manager</span><div class="mgr"><input type="hidden" name="manager" value="${boss ? boss.id : ""}"><button type="button" class="mgr-btn" data-mgr-toggle aria-haspopup="listbox" aria-expanded="false">${mgrFace(boss)}</button><div class="mgr-pop" hidden><input class="mgr-search" type="search" placeholder="Search people…" aria-label="Search people" autocomplete="off"><ul role="listbox" aria-label="Manager">${[null, ...PEOPLE.filter((q) => q.id !== p.id).sort((a, b) => a.name.localeCompare(b.name))].map((q) => `<li role="option" tabindex="-1" data-mgr-id="${q ? q.id : ""}" data-mgr-name="${q ? esc(q.name + " " + q.title).toLowerCase() : "no manager top of the organization"}">${mgrFace(q)}</li>`).join("")}</ul></div></div><small>The org chart is driven by this one field.</small></div>
          </fieldset>
        </div>
        <div class="dlg-foot"><button type="button" class="btn-line" data-close>Cancel</button><button type="submit" class="btn-save">Save changes</button></div>
      </form>`;

    const openEdit = () => {
      dlg.innerHTML = formHtml();
      dlg.showModal();
    };
    const setPane = (n) => {
      dlg.querySelectorAll("[data-pane]").forEach((el) => { el.hidden = +el.dataset.pane !== n; });
      dlg.querySelectorAll("[data-dtab]").forEach((b) => b.setAttribute("aria-selected", String(+b.dataset.dtab === n)));
    };
    dlg.addEventListener("click", (e) => {
      if (e.target === dlg || e.target.closest("[data-close]")) { dlg.close(); return; }
      const mgr = dlg.querySelector(".mgr");
      if (mgr && !e.target.closest(".mgr")) mgr.querySelector(".mgr-pop").hidden = true;
      if (e.target.closest("[data-mgr-toggle]")) {
        const pop = mgr.querySelector(".mgr-pop"); pop.hidden = !pop.hidden;
        mgr.querySelector("[data-mgr-toggle]").setAttribute("aria-expanded", String(!pop.hidden));
        if (!pop.hidden) mgr.querySelector(".mgr-search").focus();
        return;
      }
      const opt = e.target.closest("[data-mgr-id]");
      if (opt) {
        mgr.querySelector("input[name=manager]").value = opt.dataset.mgrId;
        mgr.querySelector("[data-mgr-toggle]").innerHTML = opt.innerHTML;
        mgr.querySelector(".mgr-pop").hidden = true;
        return;
      }
      const dt = e.target.closest("[data-dtab]");
      if (dt) { setPane(+dt.dataset.dtab); return; }
      const clr = e.target.closest("[data-clear]");
      if (clr) {
        const n = clr.dataset.clear;
        dlg.querySelector(`[data-pk="${n}"]`).value = ""; dlg.querySelector(`input[name="${n}"]`).value = "";
        return;
      }
      const pop = dlg.querySelector("#rtePop");
      if (pop && !pop.hidden && !e.target.closest(".rte-pop") && !e.target.closest("[data-cmd=emoji],[data-cmd=link]")) pop.hidden = true;
      if (e.target.closest("[data-emoji]")) { insertAtCursor(e.target.closest("[data-emoji]").dataset.emoji); pop.hidden = true; return; }
      if (e.target.closest("[data-pop-close]")) { pop.hidden = true; return; }
      if (e.target.closest("[data-link-ok]")) {
        let url = pop.querySelector("[name=linkUrl]").value.trim();
        const label = pop.querySelector("[name=linkText]").value.trim();
        if (!url) { pop.querySelector("[name=linkUrl]").focus(); return; }
        if (!/^(https?:|mailto:|tel:)/i.test(url)) url = "https://" + url;
        insertAtCursor(`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label || url)}</a>`, true);
        pop.hidden = true;
        return;
      }
      const cmd = e.target.closest("[data-cmd]")?.dataset.cmd;
      if (cmd === "emoji" || cmd === "link") {
        saveSel();
        if (!pop.hidden && pop.dataset.kind === cmd) { pop.hidden = true; return; }
        pop.dataset.kind = cmd;
        pop.innerHTML = cmd === "emoji"
          ? `<div class="emoji-grid" role="listbox" aria-label="Emoji">${EMOJI.map((m) => `<button type="button" data-emoji="${m}" aria-label="${m}">${m}</button>`).join("")}</div>`
          : `<div class="link-form"><label>Text to display<input name="linkText" type="text" placeholder="e.g. My portfolio" value="${esc(savedText)}"></label><label>Link URL<input name="linkUrl" type="text" placeholder="https://example.com" value=""></label><div class="link-actions"><button type="button" class="btn-line" data-pop-close>Cancel</button><button type="button" class="btn-save" data-link-ok>Insert link</button></div></div>`;
        pop.hidden = false;
        pop.querySelector("input")?.focus();
        return;
      }
      if (cmd) {
        const area = dlg.querySelector("#bio"); area.focus();
        document.execCommand(cmd);
        return;
      }
    });
    // Picker: typing an exact option label stores that option's value
    dlg.addEventListener("input", (e) => {
      if (e.target.classList.contains("mgr-search")) {
        const q = e.target.value.trim().toLowerCase();
        dlg.querySelectorAll("[data-mgr-id]").forEach((li) => { li.hidden = q && !li.dataset.mgrName.includes(q); });
        return;
      }
      const pk = e.target.closest("[data-pk]");
      if (!pk) return;
      const opt = [...dlg.querySelectorAll(`#dl-${pk.dataset.pk} option`)].find((o) => o.value === pk.value);
      const all = { pronouns: PRONOUNS.map((x) => [x, x]), timezone: ZONES }[pk.dataset.pk];
      const hit = opt && all.find(([, l]) => l === opt.value);
      dlg.querySelector(`input[name="${pk.dataset.pk}"]`).value = hit ? hit[0] : "";
    });
    dlg.addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      const bad = form.querySelector(":invalid");
      if (bad) setPane(+bad.closest("[data-pane]").dataset.pane);
      if (!form.reportValidity()) return;
      const f = new FormData(form);
      const bio = dlg.querySelector("#bio").innerHTML.trim();
      const data = Object.fromEntries(f.entries());
      Object.assign(p.edit, data, { bio });
      p.name = `${data.first.trim()} ${data.last.trim()}`.trim();
      p.title = data.jobTitle.trim() || p.title;
      const newManager = data.manager === "" ? null : +data.manager;
      if (newManager !== p.manager) p.manager = newManager;
      try { localStorage.setItem(`p5-edit-${p.id}`, JSON.stringify({ name: p.name, title: p.title, manager: p.manager, edit: p.edit })); sessionStorage.setItem("p5-saved", "1"); } catch { /* storage unavailable: edits last until reload */ }
      dlg.close();
      location.reload();
    });

    const root = document.getElementById("profile");
    root.addEventListener("click", async (e) => {
      if (e.target.closest("[data-edit]")) { openEdit(); return; }
      const pg = e.target.closest("button[data-page]");
      if (pg) { st[pg.dataset.feed].page = +pg.dataset.page; show(); return; }
      const b = e.target.closest("[data-copy]");
      if (!b) return;
      try { await navigator.clipboard.writeText(b.dataset.copy); } catch { /* clipboard unavailable: still confirm below */ }
      const m = document.getElementById("toast");
      m.textContent = "Email address copied";
      setTimeout(() => { m.textContent = ""; }, 2000);
    });
    root.addEventListener("change", (e) => {
      const s = e.target.closest("select[data-sort]");
      if (s) { st[s.dataset.feed] = { page: 1, sort: s.value }; show(); }
    });
    show();
    PHOTOS.then(show);
  </script>
</body>
</html>
