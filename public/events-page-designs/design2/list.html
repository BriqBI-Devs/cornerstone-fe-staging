<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | Cornerstone</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/base.css">
  <link rel="stylesheet" href="assets/theme5.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Cornerstone home">CORNERSTONE</a>
    <nav class="primary-nav" aria-label="Main navigation">
      <a href="/news">News</a>
      <a href="/company-culture">Company + Culture</a>
      <a class="active" href="index.html" aria-current="page">Events</a>
      <a href="/people">People</a>
      <a href="/departments">Departments</a>
      <a href="/policies-resources">Policies + Resources</a>
    </nav>
  </header>

  <main class="page ev5">
    <section class="ev5-card" aria-label="Events">
      <div class="ev5-head">
        <h1 id="pageTitle">Events</h1>
        <div class="ev5-head-right">
          <nav class="ev5-view" aria-label="Event view">
            <a href="index.html" aria-label="Calendar view" title="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg></a>
            <a class="active" href="list.html" aria-current="page" aria-label="List view" title="List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.5" cy="7" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="17" r="1" fill="currentColor"/></svg></a>
          </nav>
        </div>
      </div>
      <form class="toolbar" id="searchForm" role="search">
        <label class="search-field">
          <span class="sr-only">Search events</span>
          <button type="submit" class="search-icon-btn" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
          <input id="searchInput" type="search" placeholder="Search events" autocomplete="off">
          <kbd>⌘ K</kbd>
        </label>
        <div class="segment" id="dateSegment" role="group" aria-label="Filter by date">
          <button type="button" data-date="future">Upcoming</button>
          <button type="button" data-date="past">Past</button>
          <button type="button" data-date="all">All</button>
        </div>
        <div class="spacer"></div>
        <button class="text-button" id="clearFilters" type="button">Clear filters</button>
      </form>

      <div class="list-body">
        <p class="results-summary" id="resultsSummary" role="status"></p>
        <div id="listContent" aria-live="polite"></div>
        <nav class="pager" id="pager" aria-label="Event pages" hidden></nav>
      </div>
    </section>
    <p class="prototype-note">Design concept · Sample event information</p>
  </main>

  <script src="assets/data.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/list.js"></script>
</body>
</html>
