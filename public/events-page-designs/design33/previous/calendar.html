<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar | Cornerstone Events</title>
  <link rel="stylesheet" href="shared/events.css">
  <style>
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.filter-wrap { position: relative; }
.button { display: inline-flex; height: 36px; align-items: center; justify-content: center; gap: 7px; padding: 0 12px; border: 1px solid #d8dee5; border-radius: 6px; background: #fff; cursor: pointer; font-size: 11px; font-weight: 600; white-space: nowrap; }
.button:hover { background: #f8f9fb; }
.button svg { width: 15px; height: 15px; }
.filter-count { display: inline-grid; min-width: 17px; height: 17px; place-items: center; border-radius: 50%; background: var(--ink); color: #fff; font-size: 9px; }
.filter-panel { position: absolute; top: calc(100% + 8px); left: 0; z-index: 10; width: 220px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 12px 32px #17283b1a; }
.filter-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
.filter-panel fieldset { display: grid; gap: 9px; margin: 0; padding: 11px 0 0; border: 0; border-top: 1px solid var(--line); }
.filter-panel label { display: flex; align-items: center; gap: 8px; color: #465264; font-size: 11px; cursor: pointer; }
.filter-panel input { accent-color: var(--blue); }
.period-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.period-controls h2 { min-width: 150px; margin: 0 4px; font-size: 13px; font-weight: 600; text-align: center; }
.icon-control { display: grid; width: 30px; height: 30px; place-items: center; border: 1px solid #d8dee5; border-radius: 5px; background: #fff; cursor: pointer; font-size: 18px; line-height: 1; }
.icon-control:hover { color: var(--blue); }
.mode-switch { display: inline-flex; height: 30px; overflow: hidden; border: 1px solid #d8dee5; border-radius: 5px; }
.mode-switch button { padding: 0 11px; border: 0; background: #fff; color: #536071; cursor: pointer; font-size: 11px; font-weight: 600; }
.mode-switch button + button { border-left: 1px solid #d8dee5; }
.mode-switch button.active { background: var(--blue-soft); color: var(--blue); }

.events-content { min-height: 280px; transition: opacity .15s; }
.events-content[aria-busy="true"] { opacity: .45; pointer-events: none; }
.month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.month-week { position: relative; display: grid; grid-column: 1 / -1; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.weekday { padding: 10px 8px; border-bottom: 1px solid var(--line); background: #fafbfc; color: var(--muted); text-align: center; font-size: 9px; font-weight: 600; text-transform: uppercase; }
.month-week .day-cell { position: relative; min-height: 116px; padding: calc(35px + var(--multi-day-lanes, 0) * 20px) 7px 7px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.month-week .day-cell:nth-child(7n) { border-right: 0; }
.day-cell.outside { background: #fafbfc; }
.day-cell.outside .day-number { color: #aeb6c0; }
.day-number { position: absolute; top: 6px; left: 7px; display: grid; width: 24px; height: 24px; place-items: center; border-radius: 50%; font-size: 10px; }
.day-cell.today .day-number { background: var(--blue); color: #fff; font-weight: 700; }
.multi-day-event { position: absolute; z-index: 2; height: 18px; overflow: hidden; padding: 2px 6px; border-radius: 4px; background: #dceaff; color: #1745a4; font-size: 8px; line-height: 14px; text-overflow: ellipsis; text-decoration: none; white-space: nowrap; }
.multi-day-event:hover { background: #c8dcff; text-decoration: underline; }
.calendar-event { display: block; overflow: hidden; margin-top: 5px; padding: 4px 5px; border-radius: 4px; background: var(--blue-soft); color: #1745a4; font-size: 9px; line-height: 1.35; text-decoration: none; }
.calendar-event:hover { background: #dceaff; text-decoration: underline; }
.calendar-more { display: block; margin: 5px 0 0; color: var(--blue); font-size: 9px; font-weight: 600; text-decoration: none; }
.calendar-more:hover { text-decoration: underline; }
.week-grid { display: grid; width: 100%; grid-template-columns: 52px repeat(7, minmax(80px, 1fr)); min-width: 660px; }
.week-scroll { max-height: min(70vh, 680px); overflow: auto; overscroll-behavior: contain; scroll-padding-top: 54px; }
.week-head { position: sticky; top: 0; z-index: 5; background: #fafbfc; }
.week-head > div { padding: 9px 4px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 9px; }
.week-head > div:first-child { position: sticky; left: 0; z-index: 3; background: #fafbfc; }
.week-head strong { display: block; margin-top: 4px; color: var(--ink); font-size: 11px; }
.week-more { display: block; margin-top: 4px; color: var(--blue); font-size: 8px; font-weight: 600; text-decoration: none; }
.week-time, .week-cell { min-height: 42px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.week-time { position: sticky; left: 0; z-index: 1; padding: 4px 5px 0 0; background: #fff; color: var(--muted); text-align: right; font-size: 8px; }
.week-cell { position: relative; z-index: 0; }
.week-cell-has-multi-day { z-index: 2; }
.week-multi-day-timed-event { position: absolute; z-index: 1; top: 3px; left: 3px; right: 3px; margin: 0; }
.week-all-day-time, .week-all-day-cell { min-height: 30px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.week-all-day-time { position: sticky; left: 0; z-index: 1; padding: 4px 5px 0 0; background: #fff; color: var(--muted); text-align: right; font-size: 8px; }
.week-all-day-row { position: relative; grid-column: 1 / -1; }
.week-all-day-row .week-all-day-time, .week-all-day-row .week-all-day-cell { min-height: calc(30px + var(--multi-day-lanes, 0) * 20px); }
.week-all-day-row .week-all-day-cell { display: grid; align-content: start; gap: 2px; padding: calc(22px + var(--multi-day-lanes, 0) * 20px) 2px 2px; }
.week-all-day-row .week-all-day-event { position: absolute; z-index: 2; height: 18px; overflow: hidden; margin: 0; padding: 2px 6px; border-radius: 4px; background: #dceaff; color: #1745a4; font-size: 8px; line-height: 14px; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
.week-event { display: block; overflow: hidden; margin: 3px; padding: 4px; border-radius: 4px; background: var(--blue-soft); color: #1745a4; font-size: 8px; line-height: 1.3; text-decoration: none; }
.week-event:hover { background: #dceaff; }

.event-preview { position: fixed; z-index: 40; display: flex; width: min(340px, calc(100vw - 24px)); max-height: min(70vh, 440px); flex-direction: column; overflow: hidden; border: 1px solid #d9dfe6; border-radius: 9px; background: #fff; box-shadow: 0 12px 34px #17283b30; }
.event-preview-body { overflow-y: auto; padding: 16px; }
.event-preview-close { position: absolute; top: 9px; right: 9px; display: grid; width: 26px; height: 26px; place-items: center; padding: 0; border: 0; border-radius: 50%; background: #f0f2f5; color: var(--muted); cursor: pointer; }
.event-preview-close svg { width: 12px; height: 12px; }
.event-preview-title { display: block; margin: 0 28px 12px 0; color: var(--ink); font-family: var(--serif); font-size: 15px; font-weight: 700; line-height: 1.35; text-decoration: none; }
.event-preview-title:hover { color: var(--blue); }
.event-preview-meta { display: grid; gap: 8px; margin-bottom: 12px; color: #465264; font-size: 10.5px; line-height: 1.45; }
.event-preview-meta a { color: var(--blue); }
.event-preview-description { margin: 0; color: #465264; font-size: 10.5px; line-height: 1.55; }
.event-preview-footer { padding: 11px 16px; border-top: 1px solid var(--line); text-align: center; }
.event-preview-footer a { color: var(--blue); font-size: 11px; font-weight: 600; text-decoration: none; }
.event-preview-footer a:hover { text-decoration: underline; }

@media (max-width: 720px) {
  .period-controls { width: 100%; justify-content: space-between; margin-left: 0; }
  .period-controls h2 { min-width: 0; }
}
@media (max-width: 480px) {
  .day-cell { min-height: 70px; padding: 4px; }
  .calendar-event { padding: 3px; font-size: 8px; }
  .weekday { padding: 8px 2px; font-size: 8px; }
}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Cornerstone home">CORNERSTONE</a>
    <nav class="primary-nav" aria-label="Main navigation">
      <a href="/news">News</a>
      <a href="/company-culture">Company + Culture</a>
      <a class="active" href="index.html" aria-current="page">Events</a>
      <a href="/people">People</a>
      <a href="/departments">Departments</a>
      <a href="/policies-resources">Policies + Resources</a>
    </nav>
  </header>

  <main class="main-content">
    <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Events home</a>
    <div class="page-heading">
      <div>
        <h1>Event calendar</h1>
        <p class="intro">Browse by month or week. Search opens the full results list.</p>
      </div>
      <a class="btn" href="events.html">List view</a>
    </div>

    <section class="panel" aria-label="Calendar">
      <div class="toolbar">
        <form action="events.html" role="search" style="display:contents">
          <label class="search-field">
            <span class="sr-only">Search all events</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input name="q" type="search" placeholder="Search all events (press Enter)" autocomplete="off">
          </label>
          <input type="hidden" name="date" value="all">
        </form>
        <div class="filter-wrap">
          <button class="button" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterPanel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 5h16l-6.5 7.5v5l-3 1.5v-6.5L4 5Z"/></svg>
            My RSVP <span class="filter-count" id="filterCount" hidden>0</span>
          </button>
          <div class="filter-panel" id="filterPanel" hidden>
            <div class="filter-heading"><strong>Show events I answered</strong><button class="text-button" id="clearFilters" type="button">Clear</button></div>
            <fieldset>
              <legend class="sr-only">RSVP status</legend>
              <label><input type="checkbox" name="rsvpFilter" value="Yes"> Yes</label>
              <label><input type="checkbox" name="rsvpFilter" value="No"> No</label>
              <label><input type="checkbox" name="rsvpFilter" value="Maybe"> Maybe</label>
              <label><input type="checkbox" name="rsvpFilter" value="Pending"> Not responded</label>
            </fieldset>
          </div>
        </div>
        <div class="period-controls">
          <button class="text-button" id="todayButton" type="button">Today</button>
          <button class="icon-control" id="previousPeriod" type="button" aria-label="Previous">‹</button>
          <h2 id="periodTitle"></h2>
          <button class="icon-control" id="nextPeriod" type="button" aria-label="Next">›</button>
          <div class="mode-switch" role="group" aria-label="Calendar view">
            <button type="button" data-mode="month" class="active">Month</button>
            <button type="button" data-mode="week">Week</button>
          </div>
        </div>
      </div>
      <div id="eventsContent" class="events-content" aria-live="polite"></div>
    </section>
    <p class="prototype-note">Design concept · Sample event information</p>
  </main>

  <script src="shared/events-data.js"></script>
  <script src="shared/events-core.js"></script>
  <script>
    const { api, todayString, toDateString, formatTime, formatDate, formatEventDateTime, eventCoversDate, isMultiDayEvent, locationMarkup, eventHref, listHref, emptyState } = EventsKit;
    const content = document.getElementById("eventsContent");
    const periodTitle = document.getElementById("periodTitle");
    const filterToggle = document.getElementById("filterToggle");
    const filterPanel = document.getElementById("filterPanel");
    const urlParams = new URLSearchParams(location.search);
    const state = {
      rsvps: urlParams.getAll("rsvp"),
      anchor: new Date(2026, 9, 13),
      mode: urlParams.get("calendar") === "week" ? "week" : "month",
    };
    const maxVisibleEventsPerDay = 2;
    const fromHere = () => `calendar.html${location.search}`;
    const dayListHref = (date) => listHref({ date: "all", day: date });
    const syncUrl = () => {
      const params = new URLSearchParams();
      state.rsvps.forEach((rsvp) => params.append("rsvp", rsvp));
      if (state.mode === "week") params.set("calendar", "week");
      history.replaceState(null, "", `${location.pathname}${params.size ? `?${params}` : ""}`);
    };

    // The visible date range is the only thing the backend is asked for.
    const monthGridStart = () => {
      const first = new Date(state.anchor.getFullYear(), state.anchor.getMonth(), 1);
      return new Date(first.getFullYear(), first.getMonth(), 1 - ((first.getDay() + 6) % 7));
    };
    const weekStart = () => {
      const monday = new Date(state.anchor);
      monday.setDate(state.anchor.getDate() - ((state.anchor.getDay() + 6) % 7));
      return monday;
    };
    const addDays = (day, count) => { const next = new Date(day); next.setDate(day.getDate() + count); return next; };
    const visibleRange = () => {
      const start = state.mode === "week" ? weekStart() : monthGridStart();
      return { from: toDateString(start), to: toDateString(addDays(start, state.mode === "week" ? 6 : 41)) };
    };

    // --- Event preview popover ---
    let activeTrigger = null;
    let loadedEvents = [];
    const closePreview = () => {
      document.querySelector(".event-preview")?.remove();
      if (activeTrigger?.isConnected) activeTrigger.focus({ preventScroll: true });
      activeTrigger = null;
    };
    const openPreview = (event, trigger) => {
      closePreview();
      activeTrigger = trigger;
      const preview = document.createElement("section");
      preview.className = "event-preview";
      preview.setAttribute("role", "dialog");
      preview.setAttribute("aria-label", `${event.title} preview`);
      preview.innerHTML = `
        <button class="event-preview-close" type="button" aria-label="Close event preview"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9"/></svg></button>
        <div class="event-preview-body">
          <a class="event-preview-title"></a>
          <div class="event-preview-meta"><span class="pv-when"></span><span class="pv-where"></span><span class="pv-count"></span></div>
          <p class="event-preview-description"></p>
        </div>
        <div class="event-preview-footer"><a href="${eventHref(event, fromHere())}">View details →</a></div>`;
      document.body.append(preview);
      const title = preview.querySelector(".event-preview-title");
      title.href = eventHref(event, fromHere());
      title.textContent = event.title;
      preview.querySelector(".pv-when").textContent = formatEventDateTime(event);
      preview.querySelector(".pv-where").innerHTML = locationMarkup(event.location);
      preview.querySelector(".pv-count").textContent = event.allDay ? "" : `${event.attendees} attending`;
      preview.querySelector(".event-preview-description").textContent = event.description.split(/\n\n+/)[0];
      const rect = trigger.getBoundingClientRect();
      const box = preview.getBoundingClientRect();
      const below = rect.bottom + 8;
      preview.style.left = `${Math.max(12, Math.min(rect.left, window.innerWidth - box.width - 12))}px`;
      preview.style.top = `${below + box.height <= window.innerHeight - 12 ? below : Math.max(12, rect.top - box.height - 8)}px`;
      preview.querySelector(".event-preview-close").addEventListener("click", closePreview);
      preview.querySelector(".event-preview-close").focus();
    };
    content.addEventListener("click", (clickEvent) => {
      const trigger = clickEvent.target.closest(".calendar-event, .multi-day-event, .week-event");
      if (!trigger) return;
      clickEvent.preventDefault();
      const selected = loadedEvents.find((item) => item.id === new URL(trigger.href).searchParams.get("id"));
      if (selected) openPreview(selected, trigger);
    });
    document.addEventListener("click", (clickEvent) => {
      if (document.querySelector(".event-preview") && !clickEvent.target.closest(".event-preview, .calendar-event, .multi-day-event, .week-event")) closePreview();
    });
    document.addEventListener("keydown", (keyEvent) => {
      if (keyEvent.key === "Escape" && document.querySelector(".event-preview")) closePreview();
    });

    // --- Month view ---
    const renderMonth = (visible) => {
      const month = state.anchor.getMonth();
      periodTitle.textContent = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" }).format(state.anchor);
      const start = monthGridStart();
      const weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      const weeks = [];
      for (let week = 0; week < 6; week += 1) {
        const days = Array.from({ length: 7 }, (_, index) => addDays(start, week * 7 + index));
        const dates = days.map(toDateString);
        const multiDay = visible.filter((event) => isMultiDayEvent(event) && dates.some((date) => eventCoversDate(event, date)));
        const lanes = [];
        const bars = multiDay.map((event) => {
          const firstDay = Math.max(0, dates.findIndex((date) => eventCoversDate(event, date)));
          let lastDay = firstDay;
          for (let index = firstDay; index < dates.length && eventCoversDate(event, dates[index]); index += 1) lastDay = index;
          let lane = lanes.findIndex((laneEnd) => laneEnd < firstDay);
          if (lane === -1) lane = lanes.length;
          lanes[lane] = lastDay;
          const label = event.allDay ? `All day · ${event.title}` : `${formatTime(event.start)}–${formatTime(event.end)}${event.dailySchedule ? " daily" : ""} · ${event.title}`;
          return `<a class="multi-day-event" href="${eventHref(event, fromHere())}" title="${formatEventDateTime(event)}" style="left:${(firstDay / 7) * 100}%;width:${((lastDay - firstDay + 1) / 7) * 100}%;top:${31 + lane * 20}px">${label}</a>`;
        }).join("");
        const cells = days.map((day, index) => {
          const dateString = dates[index];
          const dayEvents = visible.filter((event) => !isMultiDayEvent(event) && eventCoversDate(event, dateString));
          const shown = dayEvents.slice(0, maxVisibleEventsPerDay);
          const more = dayEvents.length > shown.length ? `<a class="calendar-more" href="${dayListHref(dateString)}">+${dayEvents.length - shown.length} more</a>` : "";
          return `<div class="day-cell${day.getMonth() !== month ? " outside" : ""}${dateString === todayString ? " today" : ""}"><span class="day-number">${day.getDate()}</span>${shown.map((event) => `<a class="calendar-event" href="${eventHref(event, fromHere())}" title="${formatEventDateTime(event)}">${event.allDay ? "All day" : `${formatTime(event.start)}–${formatTime(event.end)}`} ${event.title}</a>`).join("")}${more}</div>`;
        }).join("");
        weeks.push(`<div class="month-week" style="--multi-day-lanes:${lanes.length}">${cells}${bars}</div>`);
      }
      content.innerHTML = `<div class="month-grid">${weekdays.map((day) => `<div class="weekday">${day}</div>`).join("")}${weeks.join("")}</div>`;
    };

    // --- Week view ---
    const renderWeek = (visible) => {
      const weekDays = Array.from({ length: 7 }, (_, index) => addDays(weekStart(), index));
      periodTitle.textContent = `${formatDate(toDateString(weekDays[0]), { month: "short", day: "numeric" })} – ${formatDate(toDateString(weekDays[6]), { month: "short", day: "numeric", year: "numeric" })}`;
      const eventsByDay = weekDays.map((day) => {
        const date = toDateString(day);
        return { date, events: visible.filter((event) => eventCoversDate(event, date)) };
      });
      const weekDates = eventsByDay.map(({ date }) => date);
      const multiDay = visible.filter((event) => event.allDay && isMultiDayEvent(event) && weekDates.some((date) => eventCoversDate(event, date)));
      const lanes = [];
      const bars = multiDay.map((event) => {
        const firstDay = Math.max(0, weekDates.findIndex((date) => eventCoversDate(event, date)));
        let lastDay = firstDay;
        for (let index = firstDay; index < weekDates.length && eventCoversDate(event, weekDates[index]); index += 1) lastDay = index;
        let lane = lanes.findIndex((laneEnd) => laneEnd < firstDay);
        if (lane === -1) lane = lanes.length;
        lanes[lane] = lastDay;
        return `<a class="week-all-day-event week-event" href="${eventHref(event, fromHere())}" title="${formatEventDateTime(event)}" style="left:calc(52px + (100% - 52px) * ${firstDay / 7});width:calc((100% - 52px) * ${(lastDay - firstDay + 1) / 7});top:${2 + lane * 20}px">${event.title}</a>`;
      });
      const allDayCells = eventsByDay.map(({ date, events: dayEvents }) => {
        const single = dayEvents.filter((event) => event.allDay && !isMultiDayEvent(event));
        const shown = single.slice(0, maxVisibleEventsPerDay);
        const more = single.length > shown.length ? `<a class="week-more" href="${dayListHref(date)}">+${single.length - shown.length} more</a>` : "";
        return `<div class="week-all-day-cell">${shown.map((event) => `<a class="week-all-day-event week-event" href="${eventHref(event, fromHere())}">${event.title}</a>`).join("")}${more}</div>`;
      }).join("");
      const rows = [`<div class="week-grid week-all-day-row" style="--multi-day-lanes:${lanes.length}"><div class="week-all-day-time">All day</div>${allDayCells}${bars.join("")}</div>`];
      for (let hour = 0; hour < 24; hour += 1) {
        rows.push(`<div class="week-time">${new Intl.DateTimeFormat("en-US", { hour: "numeric" }).format(new Date(2026, 0, 1, hour))}</div>`);
        eventsByDay.forEach(({ date, events: dayEvents }) => {
          const timed = dayEvents.filter((event) => !event.allDay);
          const shown = timed.slice(0, maxVisibleEventsPerDay);
          const atHour = shown.filter((event) => Number(event.start.slice(0, 2)) === hour);
          const showMore = timed.length > maxVisibleEventsPerDay && shown.length && Number(shown[shown.length - 1].start.slice(0, 2)) === hour;
          const more = showMore ? `<a class="week-more" href="${dayListHref(date)}">+${timed.length - shown.length} more</a>` : "";
          rows.push(`<div class="week-cell${atHour.some(isMultiDayEvent) ? " week-cell-has-multi-day" : ""}">${atHour.map((event) => {
            const minutes = Number(event.end.slice(0, 2)) * 60 + Number(event.end.slice(3)) - (Number(event.start.slice(0, 2)) * 60 + Number(event.start.slice(3)));
            const style = isMultiDayEvent(event) ? ` week-multi-day-timed-event" style="height:${Math.max(18, (minutes / 60) * 42 - 6)}px` : "";
            return `<a class="week-event${style}" href="${eventHref(event, fromHere())}" title="${formatEventDateTime(event)}">${formatTime(event.start)}–${formatTime(event.end)} ${event.title}</a>`;
          }).join("")}${more}</div>`);
        });
      }
      content.innerHTML = `<div class="week-scroll"><div class="week-grid week-head"><div></div>${weekDays.map((day) => `<div>${new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(day)}<strong>${day.getDate()}</strong></div>`).join("")}</div><div class="week-grid">${rows.join("")}</div></div>`;
    };

    // Late responses from superseded requests are discarded.
    let requestId = 0;
    const render = async () => {
      const thisRequest = ++requestId;
      syncUrl();
      closePreview();
      document.querySelectorAll("[data-mode]").forEach((button) => button.classList.toggle("active", button.dataset.mode === state.mode));
      const count = document.getElementById("filterCount");
      count.hidden = state.rsvps.length === 0;
      count.textContent = state.rsvps.length;
      content.setAttribute("aria-busy", "true");
      try {
        const visible = await api.listRange({ ...visibleRange(), rsvps: state.rsvps });
        if (thisRequest !== requestId) return;
        loadedEvents = visible;
        state.mode === "week" ? renderWeek(visible) : renderMonth(visible);
      } catch (error) {
        if (thisRequest !== requestId) return;
        console.error("Unable to load calendar events.", error);
        content.innerHTML = emptyState("We couldn't load this period", `<button type="button" class="btn" id="retryLoad" style="margin-top:14px">Retry</button>`);
        document.getElementById("retryLoad").addEventListener("click", render);
      } finally {
        if (thisRequest === requestId) content.removeAttribute("aria-busy");
      }
    };
    const shift = (direction) => {
      state.anchor = state.mode === "week"
        ? addDays(state.anchor, direction * 7)
        : new Date(state.anchor.getFullYear(), state.anchor.getMonth() + direction, 13);
      render();
    };

    document.querySelectorAll('input[name="rsvpFilter"]').forEach((box) => {
      box.checked = state.rsvps.includes(box.value);
      box.addEventListener("change", () => {
        state.rsvps = [...document.querySelectorAll('input[name="rsvpFilter"]:checked')].map((item) => item.value);
        render();
      });
    });
    filterToggle.addEventListener("click", () => {
      filterPanel.hidden = !filterPanel.hidden;
      filterToggle.setAttribute("aria-expanded", String(!filterPanel.hidden));
    });
    document.addEventListener("click", (clickEvent) => {
      if (!clickEvent.target.closest(".filter-wrap")) {
        filterPanel.hidden = true;
        filterToggle.setAttribute("aria-expanded", "false");
      }
    });
    document.getElementById("clearFilters").addEventListener("click", () => {
      state.rsvps = [];
      document.querySelectorAll('input[name="rsvpFilter"]').forEach((box) => { box.checked = false; });
      render();
    });
    document.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => { state.mode = button.dataset.mode; render(); }));
    document.getElementById("previousPeriod").addEventListener("click", () => shift(-1));
    document.getElementById("nextPeriod").addEventListener("click", () => shift(1));
    document.getElementById("todayButton").addEventListener("click", () => { state.anchor = new Date(2026, 9, 13); render(); });
    render();
  </script>
</body>
</html>
