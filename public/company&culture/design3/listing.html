<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Company + Culture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e5e5e0;
    --heading: #1b2a3a;
    --text: rgba(27, 42, 58, 0.6);
    --item: rgba(27, 42, 58, 0.45);
    --accent: #1d4ed8;
    --accent-hover: rgba(29, 78, 216, 0.08);
    --ph-bg: #e4edf7;
    --tag-events: #b45309;
    --tag-people: #be185d;
    --tag-community: #15803d;
    --tag-newsletters: #7c3aed;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: rgba(27, 42, 58, 0.55);
    text-decoration: none;
    margin-bottom: 22px;
  }
  .back-link:hover { color: var(--accent); }
  .back-link svg { width: 13px; height: 13px; }

  .page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .icon-badge {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-badge svg { width: 20px; height: 20px; }
  .icon-badge.people { background: rgba(190, 24, 93, 0.1); color: var(--tag-people); }
  .icon-badge.community { background: rgba(21, 128, 61, 0.1); color: var(--tag-community); }
  .icon-badge.events { background: rgba(180, 83, 9, 0.1); color: var(--tag-events); }
  .icon-badge.newsletters { background: rgba(124, 58, 237, 0.1); color: var(--tag-newsletters); }

  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--heading);
  }
  .page-desc {
    margin: 0 0 28px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }

  .placeholder {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--ph-bg);
    background-image: repeating-linear-gradient(45deg, rgba(27,42,58,0.08) 0, rgba(27,42,58,0.08) 1px, transparent 1px, transparent 14px);
    overflow: hidden;
  }
  .placeholder span {
    font-size: 9px;
    font-weight: 500;
    color: rgba(27, 42, 58, 0.6);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
  }

  .list-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .list-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    text-decoration: none;
    transition: background 0.12s ease;
  }
  .list-row:first-of-type { border-top: none; }
  .list-row[hidden] { display: none; }
  .list-row:hover { background: var(--bg); }
  .list-row .placeholder { width: 64px; height: 64px; flex-shrink: 0; border-radius: 8px; }
  .list-row .row-text { min-width: 0; flex: 1; }
  .list-row h3 {
    margin: 0 0 3px;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--heading);
  }
  .list-row:hover h3 { color: var(--accent); }
  .list-row .desc {
    margin: 0 0 4px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--text);
  }
  .list-row .meta { margin: 0; font-size: 11px; color: var(--item); }

  .more { margin-top: 28px; text-align: center; }
  .more .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    font: 600 12.5px/1 "Inter", sans-serif;
    color: var(--accent);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
  }
  .more .btn:hover { background: var(--accent-hover); border-color: var(--accent); }
  .more .btn svg { width: 12px; height: 12px; }
</style>
</head>
<body>
<main class="wrap">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Back to Company + Culture
  </a>

  <div class="page-head">
    <span class="icon-badge" id="pageIcon"></span>
    <h1 id="pageTitle">Category</h1>
  </div>
  <p class="page-desc" id="pageDesc"></p>

  <div class="list-card" id="itemList"></div>

  <div class="more" id="moreWrap" hidden>
    <button class="btn" id="loadMoreBtn" type="button">
      Load more
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6h9M7 2.5 10.5 6 7 9.5"/></svg>
    </button>
  </div>
</main>

<script>
  var ICONS = {
    people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    community: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
    events: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    newsletters: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
  };

  var CATEGORIES = {
    workiversaries: {
      title: "Workiversaries",
      desc: "Work anniversaries across every team, every month.",
      icon: "people",
      items: [
        { title: "This month's Workiversaries: Denise Ramirez (10 years) and Margaret Carestia (12 years)", desc: "Two incredible team members hit major milestones this month — here's to many more.", meta: "Sep 9" },
        { title: "Celebrating 5 Years: Priya Osei & Marcus Field", desc: "Five years of dedication across Property Operations and Asset Management.", meta: "Sep 2" },
        { title: "Full September Workiversary List", desc: "See every team member celebrating a work anniversary this month.", meta: "Sep 1" },
        { title: "August Workiversaries: Tom Delgado (15 years)", desc: "Fifteen years of leadership across Construction Management.", meta: "Aug 5", hidden: true },
        { title: "July Workiversaries: Nina Castillo (8 years), Owen Brooks (3 years)", desc: "Congratulations to both on reaching these milestones.", meta: "Jul 3", hidden: true }
      ]
    },
    "new-hires": {
      title: "New Hires & Welcomes",
      desc: "New faces, new babies, new chapters.",
      icon: "people",
      items: [
        { title: "Welcome Alex Kim, Priya Shah, Tomás Rivera, and Sarah Hunt — our September new hires", desc: "Say hello to the newest additions across Finance, Marketing, and Operations.", meta: "Sep 8" },
        { title: "Laura Reyes Welcomes Baby Lily, Making a Family of Four", desc: "Congratulations to Laura and her family on the newest addition.", meta: "Sep 28" },
        { title: "Connor Marsh Welcomes Baby Jeremiah", desc: "Big congratulations from the whole L+M family.", meta: "Sep 20" },
        { title: "Welcome August New Hires: Jordan Blake, Mia Chen", desc: "Say hello to our newest additions across IT and Property Management.", meta: "Aug 6", hidden: true },
        { title: "Ravi Patel & Family Welcome Baby Arjun", desc: "Congratulations to Ravi and his family on the newest addition.", meta: "Aug 22", hidden: true }
      ]
    },
    community: {
      title: "Community + Connection",
      desc: "Digests, giveaways, and volunteer days.",
      icon: "community",
      items: [
        { title: "September Community Digest is out", desc: "Saratoga harvest photos, new childcare seats, and the fall volunteer day poll.", meta: "Sep 7" },
        { title: "Fulton Park Supports Students with Annual Book Bag Giveaway", desc: "Local students received backpacks and supplies ahead of the new school year.", meta: "Sep 3" },
        { title: "The 12-Foot Snowman That Stole the Show", desc: "After last winter's storm, one snowman became the talk of the office.", meta: "Sep 5" },
        { title: "Fall Volunteer Day Announced", desc: "Sign up now for this year's fall volunteer day across all offices.", meta: "Aug 29", hidden: true },
        { title: "August Community Digest", desc: "Back-to-school drives, office moves, and team shoutouts.", meta: "Aug 7", hidden: true }
      ]
    },
    cultural: {
      title: "Cultural Observances",
      desc: "Parades, commemorations, and heritage months.",
      icon: "events",
      items: [
        { title: "Commemorating Juneteenth Across Our Communities", desc: "Teams across every office marked the occasion with events and reflection.", meta: "Jun 19" },
        { title: "L+M Shows Up and Shines at the Harlem Heritage Parade", desc: "Dozens of team members marched alongside residents and community partners.", meta: "Jun 20" },
        { title: "Honoring Hispanic Heritage Month: Stories from Our Team", desc: "Team members share what heritage month means to them and their families.", meta: "Sep 15" },
        { title: "Celebrating Diwali Across Our Offices", desc: "Teams marked the Festival of Lights with shared meals and stories.", meta: "Nov 1", hidden: true },
        { title: "Women's History Month Spotlight", desc: "Celebrating the women leading teams across L+M.", meta: "Mar 8", hidden: true }
      ]
    },
    guide: {
      title: "Company Guide",
      desc: "Meet the teams that make up L+M.",
      icon: "newsletters",
      items: [
        { title: "Company Guide — Table of Contents", desc: "Your starting point for everything you need to know about L+M.", meta: "Mar 5" },
        { title: "Meet the Teams: Communications & Marketing", desc: "What this team does, who's on it, and how to reach them.", meta: "Aug 12" },
        { title: "Meet the Teams: Building Envelope & Sustainability", desc: "Roof surveys, parapet reports, and the team behind them.", meta: "Jul 30" },
        { title: "Meet the Teams: Risk & Insurance", desc: "Vendor insurance requirements, incident reporting, and the team behind them.", meta: "Jul 15", hidden: true },
        { title: "Meet the Teams: Accounting & Finance", desc: "Expense approvals, vendor payments, and the team behind them.", meta: "Jun 28", hidden: true }
      ]
    }
  };

  var slug = new URLSearchParams(window.location.search).get("category") || "workiversaries";
  var category = CATEGORIES[slug] || CATEGORIES.workiversaries;

  document.getElementById("pageTitle").textContent = category.title;
  document.getElementById("pageDesc").textContent = category.desc;
  var pageIcon = document.getElementById("pageIcon");
  pageIcon.className = "icon-badge " + category.icon;
  pageIcon.innerHTML = ICONS[category.icon];

  var itemList = document.getElementById("itemList");
  category.items.forEach(function (item) {
    var row = document.createElement("a");
    row.className = "list-row";
    row.href = "#";
    if (item.hidden) row.hidden = true;
    row.innerHTML =
      '<div class="placeholder"><span>photo</span></div>' +
      '<div class="row-text">' +
        '<h3>' + item.title + '</h3>' +
        '<p class="desc">' + item.desc + '</p>' +
        '<p class="meta">' + item.meta + '</p>' +
      '</div>';
    itemList.appendChild(row);
  });

  var moreWrap = document.getElementById("moreWrap");
  var loadMoreBtn = document.getElementById("loadMoreBtn");
  if (itemList.querySelector(".list-row[hidden]")) {
    moreWrap.hidden = false;
    loadMoreBtn.addEventListener("click", function () {
      var next = itemList.querySelector(".list-row[hidden]");
      if (next) next.removeAttribute("hidden");
      if (!itemList.querySelector(".list-row[hidden]")) moreWrap.hidden = true;
    });
  }
</script>
</body>
</html>
