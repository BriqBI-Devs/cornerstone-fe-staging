<style>
  :root {
    box-sizing: border-box;
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e5e5e0;
    --heading: #1b2a3a;
    --text: rgba(27, 42, 58, 0.6);
    --item: rgba(27, 42, 58, 0.45);
    --accent: #1d4ed8;
    --accent-hover: rgba(29, 78, 216, 0.08);
    --ph-bg: #e4edf7;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--card);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .lang-select {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: 100px;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--heading);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
  }
  .lang-select:hover { border-color: rgba(27, 42, 58, 0.3); }
  .lang-select .lang-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
  }
  .lang-select svg { width: 13px; height: 13px; color: var(--item); flex-shrink: 0; }

  .lang-dropdown { position: relative; flex-shrink: 0; }
  .lang-select.open { border-color: var(--accent); }
  .lang-panel {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    width: 220px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(16, 24, 35, 0.12);
    padding: 10px;
    z-index: 10;
  }
  .lang-panel.open { display: block; }
  .lang-panel .group-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--item);
    padding: 6px 8px 4px;
  }
  .lang-panel .group + .group-label { margin-top: 4px; }
  .lang-option {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 13px;
    font-weight: 500;
    color: var(--heading);
    background: none;
    border: none;
    border-radius: 6px;
    padding: 8px;
    cursor: pointer;
  }
  .lang-option:hover { background: var(--bg); }
  .lang-option.selected { background: var(--accent-hover); color: var(--accent); font-weight: 600; }
  .wrap {
    max-width: 720px;
    margin: 40px auto 0;
    padding: 0 48px;
  }

  .crumb {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(27, 42, 58, 0.45);
  }
  .crumb a { color: inherit; text-decoration: none; transition: color 0.15s; }
  .crumb a:hover { color: var(--accent); text-decoration: underline; }
  .crumb a.current { color: var(--heading); }
  .crumb a.current:hover { color: var(--accent); }

  h1 {
    margin: 0 0 18px;
    font-size: 28px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.02em;
    color: var(--heading);
  }

  .byline { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    background: var(--accent-hover);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .byline .who { flex: 1; min-width: 0; }
  .byline .name-row { display: flex; align-items: center; gap: 8px; }
  .byline .name { font-size: 13.5px; font-weight: 700; color: var(--heading); }
  .byline .meta { margin-top: 2px; font-size: 12px; color: var(--item); }

  .placeholder {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--ph-bg);
    background-image: repeating-linear-gradient(45deg, rgba(27,42,58,0.08) 0, rgba(27,42,58,0.08) 1px, transparent 1px, transparent 14px);
    border-radius: 12px;
    overflow: hidden;
  }
  .placeholder span {
    font-size: 11px;
    font-weight: 500;
    color: rgba(27, 42, 58, 0.6);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
  }
  .hero-image { width: 100%; aspect-ratio: 16 / 9; }
  .hero-caption {
    margin: 10px 0 32px;
    font-size: 12.5px;
    font-style: italic;
    color: var(--item);
    text-align: center;
  }

  .article-body p {
    margin: 0 0 18px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--heading);
  }
  .article-body p.lede {
    font-size: 17px;
    font-weight: 600;
  }
  .article-body a.watch-link {
    display: inline-block;
    margin: 4px 0 28px;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .article-body a.watch-link:hover { text-decoration: underline; }

  .topics { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border); }
  .topics .label {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--item);
    margin-bottom: 12px;
  }
  .topic-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .topic-tags span {
    font-size: 12px;
    font-weight: 600;
    color: var(--heading);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
  }

  .footer-row {
    margin-top: 28px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .feedback-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: 600 13px "Inter", sans-serif;
    color: var(--heading);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 15px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .feedback-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-hover); }
  .feedback-link svg { width: 16px; height: 16px; }

  .fb-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(16, 24, 35, 0.4); opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0s 0.2s; }
  .fb-overlay.open { opacity: 1; visibility: visible; transition-delay: 0s; }
  .fb-drawer { position: fixed; left: 50%; top: 50%; z-index: 100; width: 440px; max-width: calc(100vw - 32px); padding: 22px 24px 20px; background: var(--card); border-radius: 16px; box-shadow: 0 24px 60px rgba(16, 24, 35, 0.25); opacity: 0; visibility: hidden; transform: translate(-50%, -47%); transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s 0.2s; }
  .fb-drawer.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%); transition-delay: 0s; }
  .fb-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .fb-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: var(--heading); }
  .fb-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: none; border: none; border-radius: 999px; color: var(--item); cursor: pointer; transition: background 0.15s, color 0.15s; }
  .fb-close:hover { background: var(--accent-hover); color: var(--accent); }
  .fb-close svg { width: 16px; height: 16px; }
  .fb-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text); }
  .fb-label .req { color: #c0392b; }
  .fb-drawer textarea { display: block; width: 100%; min-height: 110px; resize: vertical; padding: 11px 13px; font: 400 14px/1.55 "Inter", sans-serif; color: var(--heading); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; outline: none; transition: border-color 0.15s, background 0.15s; }
  .fb-drawer textarea:focus { border-color: var(--accent); background: var(--card); }
  .fb-drawer textarea.invalid { border-color: #c0392b; }
  .fb-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--item); }
  .fb-error { color: #c0392b; font-weight: 600; }
  .fb-error[hidden] { display: none; }
  .fb-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .fb-cancel { font: 600 13.5px "Inter", sans-serif; color: var(--text); background: none; border: 1px solid var(--border); border-radius: 9px; padding: 9px 18px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .fb-cancel:hover { border-color: var(--heading); color: var(--heading); }
  .fb-send { font: 600 13.5px "Inter", sans-serif; color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 9px; padding: 9px 20px; cursor: pointer; transition: background 0.15s; }
  .fb-send:hover { background: #1e40af; }
  .fb-done { text-align: center; padding: 14px 6px 4px; }
  .fb-done[hidden] { display: none; }
  .fb-done h3 { margin: 0 0 6px; font-size: 17px; font-weight: 800; color: var(--heading); }
  .fb-done p { margin: 0 0 18px; font-size: 13.5px; line-height: 1.55; color: var(--text); }

  .related {
    max-width: 1100px;
    margin: 0 auto 40px;
    padding: 24px 48px 0;
    border-top: 1px solid var(--border);
  }
  .related .label {
    font-size: 14px;
    font-weight: 700;
    color: var(--heading);
    margin-bottom: 16px;
  }
  .related-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

  .related-grid a { text-decoration: none; }
  .related-card .placeholder { aspect-ratio: 16 / 10; border-radius: 8px; }
  .related-card .title {

    font-weight: 700;
    line-height: 1.4;

    display: -webkit-box;

    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .related-card .title:hover { text-decoration: underline; }
  .related-card .sub {
    margin: 6px 0 0;
    font-size: 11.5px;
    color: var(--item);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .related-card .sub .section { color: var(--accent); font-weight: 600; }
  @media (max-width: 560px) {
    .related-grid { grid-template-columns: 1fr; }
  }

      lede: "What could change if you challenged the assumptions behind the choices that feel automatic?",
      body: [

      ],
      watchLink: "CLICK HERE TO WATCH: Disrupting Defaults That Limit Your Thinking →",

  };

  var slug = new URLSearchParams(window.location.search).get("story") || "manager-monday-disrupting-defaults";
  var story = STORIES[slug] || STORIES["manager-monday-disrupting-defaults"];

  document.title = story.title + " — Company + Culture";
  var crumbCategory = document.getElementById("crumbCategory");
  crumbCategory.textContent = CATEGORY_LABELS[story.category] || "Company Guide";
  crumbCategory.href = "listing.html?category=" + (story.category || "guide");
  document.getElementById("articleTitle").textContent = story.title;
  document.getElementById("authorInitials").textContent = story.initials;
  document.getElementById("authorName").textContent = story.author;
  document.getElementById("publishMeta").textContent = "Published " + story.date + " · " + story.readTime;
  document.getElementById("heroCaption").textContent = story.title;

  var bodyEl = document.getElementById("articleBody");
  var lede = document.createElement("p");
  lede.className = "lede";
  lede.textContent = story.lede;
  bodyEl.appendChild(lede);
  story.body.forEach(function (paragraph) {
    var p = document.createElement("p");
    p.textContent = paragraph;
    bodyEl.appendChild(p);
  });
  if (story.watchLink) {
    var link = document.createElement("a");
    link.className = "watch-link";
    link.href = "#";
    link.textContent = story.watchLink;
    bodyEl.appendChild(link);
  }
  if (story.reflect) {
    var reflect = document.createElement("p");
    reflect.textContent = story.reflect;
    bodyEl.appendChild(reflect);
  }

  var topicsEl = document.getElementById("topicTags");
  story.topics.forEach(function (topic) {
    var span = document.createElement("span");
    span.textContent = topic;
    topicsEl.appendChild(span);
  });

  // Related content — up to 3 other stories, same category first, then fill from everything else.
  var allSlugs = Object.keys(STORIES).filter(function (s) { return s !== slug; });
  var sameCategory = allSlugs.filter(function (s) { return STORIES[s].category === story.category; });
  var otherCategory = allSlugs.filter(function (s) { return STORIES[s].category !== story.category; });
  var related = sameCategory.concat(otherCategory).slice(0, 3);

  var relatedGrid = document.getElementById("relatedGrid");
  related.forEach(function (relSlug) {
    var relStory = STORIES[relSlug];
    var a = document.createElement("a");
    a.className = "related-card";
    a.href = "article.html?story=" + relSlug;
    a.innerHTML =
      '<div class="placeholder"><span>article</span></div>' +
      '<p class="title">' + relStory.title + '</p>' +
      '<p class="sub">In <span class="section">' + (CATEGORY_LABELS[relStory.category] || "") + '</span> on ' + relStory.date + '</p>';
    relatedGrid.appendChild(a);
  });

  // Feedback slide-over
  (function () {
    var MAX = 255;
    var overlay = document.getElementById("fbOverlay");
    var drawer = document.getElementById("fbDrawer");
    var form = document.getElementById("fbForm");
    var done = document.getElementById("fbDone");
    var text = document.getElementById("fbText");
    var count = document.getElementById("fbCount");
    var error = document.getElementById("fbError");
    var trigger = document.getElementById("openFeedback");


    function updateCount() {
      var left = MAX - text.value.length;
      count.textContent = left + (left === 1 ? " character remaining" : " characters remaining");
    }
    function openPanel() {
      form.hidden = false;
      done.hidden = true;
      overlay.classList.add("open");
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      setTimeout(function () { text.focus(); }, 320);
    }
    function closePanel() {
      overlay.classList.remove("open");
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      trigger.focus();
      setTimeout(function () {
        form.reset();
        text.classList.remove("invalid");
        error.hidden = true;
        updateCount();
        form.hidden = false;
        done.hidden = true;
      }, 320);
    }

    trigger.addEventListener("click", openPanel);
    overlay.addEventListener("click", closePanel);
    document.getElementById("fbClose").addEventListener("click", closePanel);
    document.getElementById("fbCancel").addEventListener("click", closePanel);
    document.getElementById("fbDoneClose").addEventListener("click", closePanel);
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && drawer.classList.contains("open")) closePanel();
    });
    text.addEventListener("input", function () {
      updateCount();
      if (text.value.trim()) { text.classList.remove("invalid"); error.hidden = true; }
    });
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (!text.value.trim()) {
        text.classList.add("invalid");
        error.hidden = false;
        text.focus();
        return;
      }
      form.hidden = true;
      done.hidden = false;
    });
    updateCount();
  })();
</script>
