<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Company + Culture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens taken from the Cornerstone app (src/index.css) */
  :root {
    box-sizing: border-box;
    --navy: #1b2a3a;
    --link: #1d4ed8;
    --yellow: #f5c518;
    --subtle: #f7f7f5;
    --border: #e5e5e0;
    --t60: rgba(27, 42, 58, 0.6);
    --t45: rgba(27, 42, 58, 0.45);
    --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--navy); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }

  .page { max-width: 1280px; margin: 0 auto; padding: 24px 32px 56px; }
  .back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 22px; font-size: 12.5px; font-weight: 600; color: var(--t60); }
  .back:hover { color: var(--link); }
  .back svg { width: 11px; height: 11px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .page-desc { margin-top: 8px; max-width: 460px; font-size: 14px; line-height: 1.6; color: var(--t60); }

  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; margin-top: 28px; }

  .placeholder { display: flex; align-items: center; justify-content: center; background-color: #e4edf7; background-image: repeating-linear-gradient(45deg, rgba(27,42,58,0.08) 0, rgba(27,42,58,0.08) 1px, transparent 1px, transparent 14px); border-radius: var(--radius); overflow: hidden; }
  .placeholder span { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 2px 8px; font-size: 10.5px; font-weight: 500; color: var(--t60); }

  .list-card { display: flex; flex-direction: column; gap: 12px; }
  .list-row { display: flex; align-items: center; gap: 18px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; transition: border-color 0.15s, background 0.15s; }
  .list-row:hover { border-color: rgba(27, 42, 58, 0.4); background: var(--subtle); }
  .list-row[hidden] { display: none; }
  .list-row .placeholder { width: 96px; height: 72px; flex-shrink: 0; }
  .list-row .row-text { min-width: 0; flex: 1; }
  .list-row h3 { margin-bottom: 4px; font-size: 15px; font-weight: 700; line-height: 1.35; }
  .list-row:hover h3 { color: var(--link); }
  .list-row .desc { margin-bottom: 5px; font-size: 13px; line-height: 1.5; color: var(--t60); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .list-row .meta { font-size: 12px; color: var(--t45); }

  .more { margin-top: 20px; text-align: center; }
  .more .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 30px; font: 600 12.5px "Inter", sans-serif; color: var(--link); background: #fff; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .more .btn:hover { border-color: var(--link); background: rgba(29, 78, 216, 0.08); }
  .more .btn svg { width: 12px; height: 12px; }

  .aside { position: sticky; top: 24px; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px 10px; }
  .aside h2 { margin-bottom: 8px; font-size: 15px; font-weight: 600; }
  .aside-link { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-weight: 600; transition: border-color 0.15s, background 0.15s; }
  .aside-link:hover { border-color: rgba(27, 42, 58, 0.4); background: var(--subtle); }
  .aside-link .ai { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 6px; background: var(--navy); color: #fff; }
  .aside-link .ai svg { width: 16px; height: 16px; }
  .aside-link .an { flex: 1; min-width: 0; line-height: 1.3; }
  .aside-link .ac { font-size: 12px; font-weight: 500; color: var(--t45); }
  .aside-link.current { border-color: var(--navy); background: var(--subtle); font-weight: 700; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .aside { position: static; }
  }
  @media (max-width: 640px) {
    .page { padding: 20px 16px 40px; }
    h1 { font-size: 24px; }
    .list-card { padding: 0 16px; }
    .list-row .placeholder { width: 80px; height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="index.html"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 6h-9M5 2.5 1.5 6 5 9.5"/></svg>Back to Company + Culture</a>
  <h1 id="pageTitle">Category</h1>
  <p class="page-desc" id="pageDesc"></p>
  <div class="layout">
    <div>
      <div class="list-card" id="itemList"></div>
      <div class="more" id="moreWrap" hidden>
        <button class="btn" id="loadMoreBtn" type="button">
          Load more
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6h9M7 2.5 10.5 6 7 9.5"/></svg>
        </button>
      </div>
    </div>

    <aside class="aside">
      <h2>All categories</h2>
      <div id="catLinks"></div>
    </aside>
  </div>
</main>

<script>
  var ICONS = {
    people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    community: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
    events: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    newsletters: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
  };

  var STORY_SLUGS = {
    "This month's Workiversaries: Denise Ramirez (10 years) and Margaret Carestia (12 years)": "workiversaries-sep",
    "Celebrating 5 Years: Priya Osei & Marcus Field": "workiversaries-5-years",
    "Full September Workiversary List": "workiversaries-full-list",
    "Welcome Alex Kim, Priya Shah, Tomás Rivera, and Sarah Hunt — our September new hires": "welcome-september-new-hires",
    "Laura Reyes Welcomes Baby Lily, Making a Family of Four": "laura-reyes-baby-lily",
    "Connor Marsh Welcomes Baby Jeremiah": "connor-marsh-baby-jeremiah",
    "Fun, Food, and Family at River Crossing": "river-crossing-family-day",
    "September Community Digest is out": "september-community-digest",
    "Fulton Park Supports Students with Annual Book Bag Giveaway": "fulton-park-book-bags",
    "The 12-Foot Snowman That Stole the Show": "12-foot-snowman",
    "Commemorating Juneteenth Across Our Communities": "juneteenth",
    "L+M Shows Up and Shines at the Harlem Heritage Parade": "harlem-heritage-parade",
    "Honoring Hispanic Heritage Month: Stories from Our Team": "hispanic-heritage-month",
    "Company Guide — Table of Contents": "company-guide-toc",
    "Meet the Teams: Communications & Marketing": "meet-the-teams-comms-marketing",
    "Meet the Teams: Building Envelope & Sustainability": "meet-the-teams-building-envelope",
    "August Workiversaries: Tom Delgado (15 years)": "august-workiversaries",
    "July Workiversaries: Nina Castillo (8 years), Owen Brooks (3 years)": "july-workiversaries",
    "Welcome August New Hires: Jordan Blake, Mia Chen": "august-new-hires",
    "Ravi Patel & Family Welcome Baby Arjun": "ravi-patel-baby-arjun",
    "Fall Volunteer Day Announced": "fall-volunteer-day",
    "August Community Digest": "august-community-digest",
    "Celebrating Diwali Across Our Offices": "diwali-across-offices",
    "Women's History Month Spotlight": "womens-history-month-spotlight",
    "Meet the Teams: Risk & Insurance": "meet-the-teams-risk-insurance",
    "Meet the Teams: Accounting & Finance": "meet-the-teams-accounting-finance"
  };

  var CATEGORIES = {
    workiversaries: {
      title: "Workiversaries",
      desc: "Work anniversaries across every team, every month.",
      icon: "people",
      items: [
        { title: "This month's Workiversaries: Denise Ramirez (10 years) and Margaret Carestia (12 years)", desc: "Two incredible team members hit major milestones this month — here's to many more.", meta: "Sep 9" },
        { title: "Celebrating 5 Years: Priya Osei & Marcus Field", desc: "Five years of dedication across Property Operations and Asset Management.", meta: "Sep 2" },
        { title: "Full September Workiversary List", desc: "See every team member celebrating a work anniversary this month.", meta: "Sep 1" },
        { title: "August Workiversaries: Tom Delgado (15 years)", desc: "Fifteen years of leadership across Construction Management.", meta: "Aug 5", hidden: true },
        { title: "July Workiversaries: Nina Castillo (8 years), Owen Brooks (3 years)", desc: "Congratulations to both on reaching these milestones.", meta: "Jul 3", hidden: true }
      ]
    },
    "new-hires": {
      title: "New Hires & Welcomes",
      desc: "New faces, new babies, new chapters.",
      icon: "people",
      items: [
        { title: "Welcome Alex Kim, Priya Shah, Tomás Rivera, and Sarah Hunt — our September new hires", desc: "Say hello to the newest additions across Finance, Marketing, and Operations.", meta: "Sep 8" },
        { title: "Laura Reyes Welcomes Baby Lily, Making a Family of Four", desc: "Congratulations to Laura and her family on the newest addition.", meta: "Sep 28" },
        { title: "Connor Marsh Welcomes Baby Jeremiah", desc: "Big congratulations from the whole L+M family.", meta: "Sep 20" },
        { title: "Welcome August New Hires: Jordan Blake, Mia Chen", desc: "Say hello to our newest additions across IT and Property Management.", meta: "Aug 6", hidden: true },
        { title: "Ravi Patel & Family Welcome Baby Arjun", desc: "Congratulations to Ravi and his family on the newest addition.", meta: "Aug 22", hidden: true }
      ]
    },
    community: {
      title: "Community + Connection",
      desc: "Digests, giveaways, and volunteer days.",
      icon: "community",
      items: [
        { title: "Fun, Food, and Family at River Crossing", desc: "We held our second annual Family Day at River Crossing this past Saturday, and it was nothing short of a great time.", meta: "Sep 6" },
        { title: "September Community Digest is out", desc: "Saratoga harvest photos, new childcare seats, and the fall volunteer day poll.", meta: "Sep 7" },
        { title: "Fulton Park Supports Students with Annual Book Bag Giveaway", desc: "Local students received backpacks and supplies ahead of the new school year.", meta: "Sep 3" },
        { title: "The 12-Foot Snowman That Stole the Show", desc: "After last winter's storm, one snowman became the talk of the office.", meta: "Sep 5" },
        { title: "Fall Volunteer Day Announced", desc: "Sign up now for this year's fall volunteer day across all offices.", meta: "Aug 29", hidden: true },
        { title: "August Community Digest", desc: "Back-to-school drives, office moves, and team shoutouts.", meta: "Aug 7", hidden: true }
      ]
    },
    cultural: {
      title: "Cultural Observances",
      desc: "Parades, commemorations, and heritage months.",
      icon: "events",
      items: [
        { title: "Commemorating Juneteenth Across Our Communities", desc: "Teams across every office marked the occasion with events and reflection.", meta: "Jun 19" },
        { title: "L+M Shows Up and Shines at the Harlem Heritage Parade", desc: "Dozens of team members marched alongside residents and community partners.", meta: "Jun 20" },
        { title: "Honoring Hispanic Heritage Month: Stories from Our Team", desc: "Team members share what heritage month means to them and their families.", meta: "Sep 15" },
        { title: "Celebrating Diwali Across Our Offices", desc: "Teams marked the Festival of Lights with shared meals and stories.", meta: "Nov 1", hidden: true },
        { title: "Women's History Month Spotlight", desc: "Celebrating the women leading teams across L+M.", meta: "Mar 8", hidden: true }
      ]
    },
    guide: {
      title: "Company Guide",
      desc: "Meet the teams that make up L+M.",
      icon: "newsletters",
      items: [
        { title: "Company Guide — Table of Contents", desc: "Your starting point for everything you need to know about L+M.", meta: "Mar 5" },
        { title: "Meet the Teams: Communications & Marketing", desc: "What this team does, who's on it, and how to reach them.", meta: "Aug 12" },
        { title: "Meet the Teams: Building Envelope & Sustainability", desc: "Roof surveys, parapet reports, and the team behind them.", meta: "Jul 30" },
        { title: "Meet the Teams: Risk & Insurance", desc: "Vendor insurance requirements, incident reporting, and the team behind them.", meta: "Jul 15", hidden: true },
        { title: "Meet the Teams: Accounting & Finance", desc: "Expense approvals, vendor payments, and the team behind them.", meta: "Jun 28", hidden: true }
      ]
    }
  };
  var slug = new URLSearchParams(window.location.search).get("category") || "workiversaries";
  if (!CATEGORIES[slug]) slug = "workiversaries";
  var category = CATEGORIES[slug];

  document.title = category.title + " — Company + Culture";
  document.getElementById("pageTitle").textContent = category.title;
  document.getElementById("pageDesc").textContent = category.desc;

  var catLinks = document.getElementById("catLinks");
  Object.keys(CATEGORIES).forEach(function (key) {
    var c = CATEGORIES[key];
    var a = document.createElement("a");
    a.href = "listing.html?category=" + key;
    a.className = "aside-link" + (key === slug ? " current" : "");
    a.innerHTML = '<span class="ai">' + (ICONS[c.icon] || "") + '</span><span class="an">' + c.title.replace("&", "&amp;") + '</span><span class="ac">' + c.items.length + '</span>';
    catLinks.appendChild(a);
  });

  var itemList = document.getElementById("itemList");
  category.items.forEach(function (item) {
    var row = document.createElement("a");
    row.className = "list-row";
    row.href = STORY_SLUGS[item.title] ? "article.html?story=" + STORY_SLUGS[item.title] : "#";
    if (item.hidden) row.hidden = true;
    row.innerHTML =
      '<div class="placeholder"><span>photo</span></div>' +
      '<div class="row-text">' +
        '<h3>' + item.title + '</h3>' +
        '<p class="desc">' + item.desc + '</p>' +
        '<p class="meta">' + item.meta + '</p>' +
      '</div>';
    itemList.appendChild(row);
  });

  var moreWrap = document.getElementById("moreWrap");
  var loadMoreBtn = document.getElementById("loadMoreBtn");
  if (itemList.querySelector(".list-row[hidden]")) {
    moreWrap.hidden = false;
    loadMoreBtn.addEventListener("click", function () {
      var next = itemList.querySelector(".list-row[hidden]");
      if (next) next.removeAttribute("hidden");
      if (!itemList.querySelector(".list-row[hidden]")) moreWrap.hidden = true;
    });
  }
</script>
</body>
</html>
